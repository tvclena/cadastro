<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>📺 EPG Profissional</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#070a11;
  --panel:#0e1422;
  --line:#1f2a3d;
  --card:#1c2436;
  --primary:#2bbcff;
  --text:#fff;
  --muted:#9aa4b2;
}
*{box-sizing:border-box;font-family:Inter,system-ui}
body{margin:0;background:radial-gradient(circle at top,#101a30,#070a11);color:#fff;overflow:hidden}
.top{height:64px;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--line)}
.app{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 64px)}
.canais{background:var(--panel);border-right:1px solid var(--line)}
.canal{height:88px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);cursor:pointer}
.canal.active{background:#16203a;box-shadow:inset 4px 0 0 var(--primary)}
.grade{overflow:auto}
.horas{display:flex;position:sticky;top:0;background:var(--panel)}
.hora{min-width:160px;text-align:center;padding:10px 0;border-left:1px solid var(--line);color:var(--muted)}
.linha{position:relative;height:88px;border-bottom:1px solid var(--line)}
.bloco{
  position:absolute;top:12px;height:64px;
  background:linear-gradient(135deg,#36c7ff,#1aa3e8);
  border-radius:12px;padding:6px;font-size:12px;color:#00131d
}
</style>
</head>

<body>

<div class="top">
  <b>📺 EPG Profissional</b>
  <input type="date" id="data">
</div>

<div class="app">
  <div class="canais" id="canais"></div>
  <div class="grade">
    <div class="horas" id="horas"></div>
    <div id="linhas"></div>
  </div>
</div>

<script>
const supabase = window.supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

const DAY = 1440;
let canalAtual = null;

/* HORAS */
const horas=document.getElementById("horas");
for(let h=0;h<24;h++){
  horas.innerHTML+=`<div class="hora">${String(h).padStart(2,'0')}:00</div>`;
}

/* LOAD */
async function load(){
  const data=document.getElementById("data").value;

  const {data:canais}=await supabase
    .from("canais")
    .select("*")
    .eq("ativo",true)
    .order("ordem");

  const canaisEl=document.getElementById("canais");
  const linhasEl=document.getElementById("linhas");
  canaisEl.innerHTML=""; linhasEl.innerHTML="";

  canais.forEach(c=>{
    const div=document.createElement("div");
    div.className="canal";
    div.innerText=c.nome;
    div.onclick=()=>selecionarCanal(c.id,div);
    canaisEl.appendChild(div);
    linhasEl.innerHTML+=`<div class="linha" data-canal="${c.id}"></div>`;
  });

  renderProgramacao(data);
}

function selecionarCanal(id,el){
  canalAtual=id;
  document.querySelectorAll(".canal").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
}

/* PROGRAMAÇÃO */
async function renderProgramacao(data){
  const {data:prog}=await supabase
    .from("programacao")
    .select("*,filmes(*)")
    .eq("data",data);

  document.querySelectorAll(".linha").forEach(linha=>{
    linha.innerHTML="";
    const canal=linha.dataset.canal;

    prog.filter(p=>p.canal_id===canal).forEach(p=>{
      const b=document.createElement("div");
      b.className="bloco";
      b.style.left=(p.inicio_minuto/DAY)*100+"%";
      b.style.width=(p.duracao_minutos/DAY)*100+"%";
      b.innerHTML=`
        <b>${p.filmes.titulo}</b>
        <small>${p.duracao_minutos} min</small>
      `;
      linha.appendChild(b);
    });
  });
}

/* ADD TESTE (DUPLO CLIQUE NA TELA) */
document.body.ondblclick=async ()=>{
  if(!canalAtual) return alert("Selecione um canal");

  const data=document.getElementById("data").value;

  const {data:last}=await supabase
    .from("programacao")
    .select("*")
    .eq("canal_id",canalAtual)
    .eq("data",data)
    .order("inicio_minuto",{ascending:false})
    .limit(1);

  const inicio=last?.[0]
    ? last[0].inicio_minuto+last[0].duracao_minutos
    : 0;

  const {data:filme}=await supabase
    .from("filmes")
    .select("*")
    .limit(1)
    .single();

  await supabase.from("programacao").insert({
    canal_id:canalAtual,
    filme_id:filme.id,
    data:data,
    inicio_minuto:inicio,
    duracao_minutos:filme.duracao_minutos||120
  });

  load();
};

/* INIT */
document.getElementById("data").value=new Date().toISOString().split("T")[0];
load();
</script>

</body>
</html>

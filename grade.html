<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>📺 EPG Profissional</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#070b14;
  --panel:#0e1627;
  --line:#1e2a40;
  --block:#2bbcff;
  --text:#ffffff;
  --muted:#9aa4b2;
}
*{box-sizing:border-box;font-family:Inter,system-ui}
body{
  margin:0;
  background:linear-gradient(180deg,#0b1222,#070b14);
  color:var(--text);
  overflow:hidden;
}

/* TOPO */
.topbar{
  height:64px;
  display:flex;
  align-items:center;
  gap:16px;
  padding:0 24px;
  border-bottom:1px solid var(--line);
}
.topbar input{
  background:#0f1a2e;
  color:#fff;
  border:none;
  padding:8px 12px;
  border-radius:8px;
}

/* LAYOUT */
.wrapper{
  display:grid;
  grid-template-columns:220px 1fr;
  height:calc(100vh - 64px);
}

/* CANAIS */
.channels{
  background:var(--panel);
  border-right:1px solid var(--line);
}
.channel{
  height:88px;
  display:flex;
  align-items:center;
  padding:0 16px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  font-weight:600;
}
.channel.active{
  background:#162343;
}

/* GRADE */
.grid{
  overflow:auto;
}
.time-header{
  display:flex;
  position:sticky;
  top:0;
  background:var(--panel);
  z-index:5;
}
.time{
  min-width:120px;
  text-align:center;
  padding:10px 0;
  border-left:1px solid var(--line);
  font-size:12px;
  color:var(--muted);
}
.row{
  position:relative;
  height:88px;
  border-bottom:1px solid var(--line);
}

/* BLOCO */
.block{
  position:absolute;
  top:10px;
  height:68px;
  background:var(--block);
  border-radius:10px;
  padding:6px;
  color:#000;
  display:flex;
  gap:6px;
  font-size:11px;
}
.block img{
  width:36px;
  height:52px;
  border-radius:6px;
  object-fit:cover;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
}
.modal-box{
  width:760px;
  max-height:80vh;
  background:#0e1627;
  border-radius:16px;
  padding:16px;
  display:flex;
  flex-direction:column;
}
.modal-header{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.modal-header input,
.modal-header select{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  background:#121f3a;
  color:#fff;
}
.modal-list{
  overflow-y:auto;
}
.modal-item{
  display:flex;
  gap:12px;
  background:#121f3a;
  padding:10px;
  border-radius:12px;
  margin-bottom:10px;
  cursor:pointer;
}
.modal-item img{
  width:60px;
  height:90px;
  border-radius:8px;
  object-fit:cover;
}
.modal-item small{
  color:var(--muted);
}
</style>
</head>

<body>

<div class="topbar">
  <b>📺 EPG Profissional</b>
  <input type="date" id="data">
</div>

<div class="wrapper">
  <div class="channels" id="channels"></div>
  <div class="grid">
    <div class="time-header" id="timeHeader"></div>
    <div id="rows"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-header">
      <input id="busca" placeholder="Buscar conteúdo">
      <select id="categoria"></select>
    </div>
    <div class="modal-list" id="lista"></div>
  </div>
</div>

<script>
const supabase = window.supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

const DAY = 1440;
let canalAtivo = null;
let filmes = [];

/* UTIL */
const minToPx = min => (min / DAY) * 100;

/* HEADER HORAS */
const th = document.getElementById("timeHeader");
for(let h=0; h<24; h++){
  th.innerHTML += `<div class="time">${String(h).padStart(2,'0')}:00</div>`;
}

/* LOAD */
async function load(){
  document.getElementById("data").value ||= new Date().toISOString().split("T")[0];

  const canais = ["Filmes 24h","Terror 24h","Ação Total","Clássicos","Sessão Família"];
  const ch = document.getElementById("channels");
  const rows = document.getElementById("rows");
  ch.innerHTML=""; rows.innerHTML="";

  canais.forEach(c=>{
    const el=document.createElement("div");
    el.className="channel";
    el.textContent=c;
    el.onclick=()=>selectCanal(c,el);
    el.ondblclick=openModal;
    ch.appendChild(el);
    rows.innerHTML+=`<div class="row" data-canal="${c}"></div>`;
  });

  const r = await supabase.from("filmes").select("*").eq("ativo",true);
  filmes = r.data || [];
  renderCategorias();
  renderProgramacao();
}

function selectCanal(c,el){
  canalAtivo=c;
  document.querySelectorAll(".channel").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
}

async function renderProgramacao(){
  const data = document.getElementById("data").value;
  const r = await supabase.from("programacao").select("*,filmes(*)").eq("data",data);

  document.querySelectorAll(".row").forEach(row=>{
    row.innerHTML="";
    r.data?.filter(p=>p.canal===row.dataset.canal).forEach(p=>{
      const b=document.createElement("div");
      b.className="block";
      b.style.left=minToPx(p.inicio_minuto)+"%";
      b.style.width=minToPx(p.duracao_minutos)+"%";
      b.innerHTML=`
        <img src="${p.filmes?.capa_url}">
        <div>
          <b>${p.filmes?.titulo}</b><br>
          <small>${p.duracao_minutos} min</small>
        </div>`;
      row.appendChild(b);
    });
  });
}

/* MODAL */
function openModal(){
  if(!canalAtivo) return alert("Selecione um canal");
  document.getElementById("modal").style.display="flex";
  aplicarFiltro();
}
document.getElementById("modal").onclick=e=>{
  if(e.target.id==="modal") e.target.style.display="none";
};

function renderCategorias(){
  const sel=document.getElementById("categoria");
  const cats=[...new Set(filmes.map(f=>f.categoria).filter(Boolean))];
  sel.innerHTML='<option value="">Todas categorias</option>';
  cats.forEach(c=>sel.innerHTML+=`<option>${c}</option>`);
}

function aplicarFiltro(){
  const nome=document.getElementById("busca").value.toLowerCase();
  const cat=document.getElementById("categoria").value;
  const list=document.getElementById("lista");
  list.innerHTML="";

  filmes.filter(f=>
    (!nome || f.titulo.toLowerCase().includes(nome)) &&
    (!cat || f.categoria===cat)
  ).forEach(f=>{
    const d=document.createElement("div");
    d.className="modal-item";
    d.ondblclick=()=>addConteudo(f);
    d.innerHTML=`
      <img src="${f.capa_url}">
      <div>
        <b>${f.titulo}</b><br>
        <small>${f.categoria} • ${f.duracao_minutos||120} min</small>
      </div>`;
    list.appendChild(d);
  });
}

async function addConteudo(f){
  const data=document.getElementById("data").value;

  const r = await supabase
    .from("programacao")
    .select("inicio_minuto,duracao_minutos")
    .eq("canal",canalAtivo)
    .eq("data",data)
    .order("inicio_minuto",{ascending:false})
    .limit(1);

  const inicio = r.data?.[0]
    ? r.data[0].inicio_minuto + r.data[0].duracao_minutos
    : 0;

  await supabase.from("programacao").insert({
    canal: canalAtivo,
    filme_id: f.id,
    data,
    inicio_minuto: inicio,
    duracao_minutos: f.duracao_minutos || 120
  });

  document.getElementById("modal").style.display="none";
  renderProgramacao();
}

document.getElementById("busca").oninput=aplicarFiltro;
document.getElementById("categoria").onchange=aplicarFiltro;

load();
</script>
</body>
</html>

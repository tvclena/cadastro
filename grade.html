<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>📺 EPG – Criação de Grade</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#0b0f17;
  --panel:#0f1420;
  --card:#1c2230;
  --hover:#2f3a52;
  --primary:#00c6ff;
  --secondary:#0072ff;
  --text:#ffffff;
  --muted:#9aa4b2;
}

*{box-sizing:border-box;font-family:Inter,system-ui}

body{
  margin:0;
  background:radial-gradient(circle at top,#10182a,#070a11);
  color:var(--text);
  overflow:hidden;
}

/* TOP */
.topbar{
  height:64px;
  display:flex;
  align-items:center;
  gap:16px;
  padding:0 22px;
  border-bottom:1px solid #1c2230;
}

.topbar b{font-size:18px}

/* LAYOUT */
.layout{
  display:grid;
  grid-template-columns:320px 1fr;
  height:calc(100vh - 64px);
}

/* LEFT */
.library{
  background:var(--panel);
  border-right:1px solid #1c2230;
  display:flex;
  flex-direction:column;
}

.library header{
  padding:14px;
}

.library input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  background:var(--card);
  color:var(--text);
}

/* FILMES */
.filmes{
  overflow-y:auto;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.filme{
  display:flex;
  gap:12px;
  background:var(--card);
  padding:10px;
  border-radius:14px;
  cursor:grab;
  transition:.2s;
}

.filme:hover{
  background:var(--hover);
  transform:translateY(-2px);
}

/* GRADE */
.grade{
  padding:16px;
  overflow:auto;
}

.timeline{
  position:relative;
  height:140px;
  border-radius:16px;
  background:linear-gradient(180deg,#0f1420,#0b0f17);
  border:1px solid #1c2230;
}

.hour{
  position:absolute;
  top:0;
  bottom:0;
  width:1px;
  background:#1c2230;
}

.hour-label{
  position:absolute;
  top:10px;
  font-size:12px;
  color:var(--muted);
  transform:translateX(-50%);
}

.drop-area{
  position:absolute;
  left:0;
  right:0;
  bottom:16px;
  height:90px;
}

/* BLOCO */
.block{
  position:absolute;
  top:0;
  height:80px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  border-radius:16px;
  padding:10px 12px;
  color:#fff;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  transition:.2s;
}

.block:hover{
  transform:scale(1.03);
  z-index:5;
}

.block b{font-size:14px}
.block small{font-size:11px;opacity:.85}
</style>
</head>

<body>

<div class="topbar">
  <b>📺 Grade de Programação</b>
  <select id="canalSelect"></select>
  <input type="date" id="data">
</div>

<div class="layout">

  <div class="library">
    <header>
      <input id="search" placeholder="Buscar filme / categoria / duração">
    </header>
    <div class="filmes" id="filmes"></div>
  </div>

  <div class="grade">
    <div class="timeline" id="timeline">
      <div class="drop-area" id="dropArea"></div>
    </div>
  </div>

</div>

<script>
/* SUPABASE */
const SUPABASE_URL = "https://dxkszikemntfusfyrzos.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DAY_MINUTES = 1440;
const timeline = document.getElementById("timeline");
const dropArea = document.getElementById("dropArea");

/* TIMELINE */
for(let h=0;h<24;h++){
  const left=(h*60/DAY_MINUTES)*100;
  timeline.insertAdjacentHTML("beforeend",
    `<div class="hour" style="left:${left}%"></div>
     <div class="hour-label" style="left:${left}%">${String(h).padStart(2,"0")}:00</div>`
  );
}

/* LOAD CANAIS */
async function loadCanais(){
  const {data}=await db.from("canais").select("*").order("ordem");
  const s=document.getElementById("canalSelect");
  s.innerHTML="";
  data.forEach(c=>{
    s.innerHTML+=`<option value="${c.id}">${c.nome}</option>`;
  });
}

/* LOAD FILMES */
async function loadFilmes(){
  const {data}=await db.from("filmes").select("*").eq("ativo",true);
  const lista=document.getElementById("filmes");
  lista.innerHTML="";
  data.forEach(f=>{
    lista.innerHTML+=`
      <div class="filme" draggable="true"
        data-id="${f.id}"
        data-titulo="${f.titulo}"
        data-duracao="${f.duracao_minutos||120}">
        <b>${f.titulo}</b>
        <small>${f.categoria||""} • ${f.duracao_minutos||120} min</small>
      </div>`;
  });

  document.querySelectorAll(".filme").forEach(el=>{
    el.addEventListener("dragstart",e=>{
      e.dataTransfer.setData("text",JSON.stringify(el.dataset));
    });
  });
}

/* DROP */
dropArea.addEventListener("dragover",e=>e.preventDefault());

dropArea.addEventListener("drop",async e=>{
  const d=JSON.parse(e.dataTransfer.getData("text"));
  const rect=dropArea.getBoundingClientRect();
  const start=Math.floor(((e.clientX-rect.left)/rect.width)*DAY_MINUTES);
  await salvarProgramacao(d,start);
});

/* SALVAR */
async function salvarProgramacao(d,start){
  const dur=parseInt(d.duracao);
  const canal=document.getElementById("canalSelect").value;
  const data=document.getElementById("data").value;

  let inicio=start;
  let restante=dur;

  while(restante>0){
    const fim=Math.min(inicio+restante,1440);

    await db.from("programacao").insert({
      canal_id:canal,
      filme_id:d.id,
      data:data,
      inicio_minuto:inicio,
      fim_minuto:fim,
      duracao_minutos:(fim-inicio),
      continua_dia_seguinte:(fim===1440)
    });

    renderBlock(d.titulo,inicio,fim-inicio);
    restante-= (fim-inicio);
    inicio=0;
  }
}

/* RENDER */
function renderBlock(titulo,start,dur){
  const block=document.createElement("div");
  block.className="block";
  block.style.left=(start/DAY_MINUTES)*100+"%";
  block.style.width=(dur/DAY_MINUTES)*100+"%";
  block.innerHTML=`<b>${titulo}</b><small>${dur} min</small>`;
  dropArea.appendChild(block);
}

/* INIT */
document.getElementById("data").value=new Date().toISOString().split("T")[0];
loadCanais();
loadFilmes();
</script>

</body>
</html>

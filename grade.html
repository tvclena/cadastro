<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>📺 EPG – Criação de Grade</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#0b0f17;
  --panel:#0f1420;
  --card:#1c2230;
  --card-2:#222a3a;
  --hover:#2f3a52;
  --primary:#00a8ff;
  --accent:#4dd0e1;
  --text:#ffffff;
  --muted:#9aa4b2;
}

*{box-sizing:border-box;font-family:Inter,system-ui,-apple-system}

body{
  margin:0;
  background:linear-gradient(180deg,#0b0f17,#070a11);
  color:var(--text);
  overflow:hidden;
}

/* TOP BAR */
.topbar{
  height:64px;
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 22px;
  background:rgba(11,15,23,.95);
  border-bottom:1px solid #1c2230;
}

.topbar b{
  font-size:18px;
  letter-spacing:.3px;
}

.topbar select,
.topbar input[type=date]{
  background:var(--card);
  color:var(--text);
  border:none;
  padding:10px 14px;
  border-radius:10px;
  font-size:14px;
}

/* LAYOUT */
.layout{
  display:grid;
  grid-template-columns:320px 1fr;
  height:calc(100vh - 64px);
}

/* LEFT – BIBLIOTECA */
.library{
  background:var(--panel);
  border-right:1px solid #1c2230;
  display:flex;
  flex-direction:column;
}

.library header{
  padding:14px;
  border-bottom:1px solid #1c2230;
}

.library input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  background:var(--card);
  color:var(--text);
  font-size:14px;
}

/* FILMES */
.filmes{
  overflow-y:auto;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.filme{
  display:flex;
  gap:12px;
  background:var(--card);
  padding:10px;
  border-radius:14px;
  cursor:grab;
  transition:.2s;
}

.filme:hover{
  background:var(--hover);
  transform:translateY(-1px);
}

.filme img{
  width:56px;
  height:82px;
  border-radius:10px;
  object-fit:cover;
}

.filme b{
  font-size:14px;
  display:block;
}

.filme small{
  font-size:12px;
  color:var(--muted);
}

/* GRADE */
.grade{
  position:relative;
  overflow:auto;
  padding:12px;
}

.timeline{
  position:relative;
  height:130px;
  background:linear-gradient(180deg,#0f1420,#0b0f17);
  border-radius:14px;
  border:1px solid #1c2230;
}

/* HORAS */
.hour{
  position:absolute;
  top:0;
  bottom:0;
  width:1px;
  background:#1c2230;
}

.hour-label{
  position:absolute;
  top:8px;
  font-size:12px;
  color:var(--muted);
  transform:translateX(-50%);
}

/* DROP */
.drop-area{
  position:absolute;
  left:0;
  right:0;
  bottom:12px;
  height:80px;
}

/* BLOCO */
.block{
  position:absolute;
  top:0;
  height:70px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  border-radius:14px;
  padding:10px;
  cursor:pointer;
  overflow:hidden;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}

.block b{
  font-size:14px;
  display:block;
}

.block small{
  font-size:11px;
  opacity:.85;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <b>📺 Grade de Programação</b>
  <select id="canalSelect"></select>
  <input type="date" id="data">
</div>

<div class="layout">

  <!-- BIBLIOTECA -->
  <div class="library">
    <header>
      <input id="search" placeholder="Buscar filme / categoria / duração">
    </header>
    <div class="filmes" id="filmes"></div>
  </div>

  <!-- GRADE -->
  <div class="grade">
    <div class="timeline" id="timeline">
      <div class="drop-area" id="dropArea"></div>
    </div>
  </div>

</div>

<script>
/* ==============================
   SUPABASE
============================== */
const SUPABASE_URL = "https://dxkszikemntfusfyrzos.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

/* ============================== */

const DAY_MINUTES = 1440;
const timeline = document.getElementById("timeline");
const dropArea = document.getElementById("dropArea");

/* TIMELINE 24H */
for(let h=0;h<24;h++){
  const left = (h*60/DAY_MINUTES)*100;

  const line=document.createElement("div");
  line.className="hour";
  line.style.left=left+"%";
  timeline.appendChild(line);

  const label=document.createElement("div");
  label.className="hour-label";
  label.style.left=left+"%";
  label.innerText=`${String(h).padStart(2,"0")}:00`;
  timeline.appendChild(label);
}

/* CANAIS */
async function loadCanais(){
  const { data } = await db.from("canais").select("*").order("ordem");
  const select=document.getElementById("canalSelect");
  select.innerHTML="";
  data?.forEach(c=>{
    const o=document.createElement("option");
    o.value=c.id;
    o.innerText=c.nome;
    select.appendChild(o);
  });
}

/* FILMES */
async function loadFilmes(){
  const { data } = await db
    .from("filmes")
    .select("*")
    .eq("ativo",true)
    .order("titulo");

  const lista=document.getElementById("filmes");
  lista.innerHTML="";

  data?.forEach(f=>{
    const div=document.createElement("div");
    div.className="filme";
    div.draggable=true;
    div.dataset.duracao=f.duracao_minutos || 120;
    div.dataset.titulo=f.titulo;

    div.innerHTML=`
      <img src="${f.capa_url}">
      <div>
        <b>${f.titulo}</b>
        <small>${f.categoria || "—"} • ${div.dataset.duracao} min</small>
      </div>
    `;

    div.addEventListener("dragstart",e=>{
      e.dataTransfer.setData("text",JSON.stringify(div.dataset));
    });

    lista.appendChild(div);
  });
}

/* DROP */
dropArea.addEventListener("dragover",e=>e.preventDefault());

dropArea.addEventListener("drop",e=>{
  const data=JSON.parse(e.dataTransfer.getData("text"));
  const rect=dropArea.getBoundingClientRect();
  const x=e.clientX-rect.left;
  const startMin=Math.floor((x/rect.width)*DAY_MINUTES);
  createBlock(data.titulo,startMin,parseInt(data.duracao));
});

/* BLOCO */
function createBlock(titulo,start,duracao){
  let remaining=duracao;
  let currentStart=start;

  while(remaining>0){
    const block=document.createElement("div");
    block.className="block";

    const maxToday=DAY_MINUTES-currentStart;
    const thisDur=Math.min(remaining,maxToday);

    block.style.left=(currentStart/DAY_MINUTES)*100+"%";
    block.style.width=(thisDur/DAY_MINUTES)*100+"%";
    block.innerHTML=`<b>${titulo}</b><small>${thisDur} min</small>`;

    dropArea.appendChild(block);

    remaining-=thisDur;
    currentStart=0;
  }
}

/* INIT */
document.getElementById("data").value =
  new Date().toISOString().split("T")[0];

loadCanais();
loadFilmes();
</script>

</body>
</html>

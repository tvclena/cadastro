<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>📺 EPG Profissional</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#070a11;
  --panel:#0e1422;
  --line:#1f2a3d;
  --card:#1c2436;
  --content:#2bbcff;
  --text:#fff;
  --muted:#9aa4b2;
}
*{box-sizing:border-box;font-family:Inter,system-ui}
body{margin:0;background:radial-gradient(circle at top,#101a30,#070a11);color:#fff;overflow:hidden}

/* TOP */
.topbar{
  height:64px;display:flex;align-items:center;gap:16px;
  padding:0 24px;border-bottom:1px solid var(--line)
}

/* GRID */
.wrapper{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 64px)}

/* CANAIS */
.channels{background:var(--panel);border-right:1px solid var(--line)}
.channel{
  height:90px;display:flex;align-items:center;
  padding:0 16px;border-bottom:1px solid var(--line);
  cursor:pointer;font-weight:600
}
.channel.selected{background:#16203a}

/* GRADE */
.grid{overflow:auto}
.time-header{display:flex;position:sticky;top:0;background:var(--panel);z-index:5}
.time{
  min-width:160px;text-align:center;
  padding:10px 0;border-left:1px solid var(--line);
  color:var(--muted);font-size:13px
}
.row{position:relative;height:90px;border-bottom:1px solid var(--line)}

/* BLOCO */
.block{
  position:absolute;top:12px;height:66px;border-radius:12px;
  padding:6px 8px;background:var(--content);
  color:#000;font-size:12px;cursor:grab;overflow:hidden
}
.block img{
  width:36px;height:52px;border-radius:6px;
  float:left;margin-right:6px;object-fit:cover
}

/* MODAL */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  display:none;align-items:center;justify-content:center;z-index:99
}
.modal-box{
  width:760px;max-height:80vh;background:#0e1422;
  border-radius:16px;padding:16px;display:flex;flex-direction:column
}
.modal-header{display:flex;gap:8px;margin-bottom:12px}
.modal-header input,select{
  flex:1;padding:10px;border-radius:10px;
  border:none;background:var(--card);color:#fff
}
.modal-list{overflow-y:auto;flex:1}
.modal-item{
  display:flex;gap:12px;padding:10px;border-radius:12px;
  background:var(--card);cursor:pointer;margin-bottom:10px
}
.modal-item img{
  width:60px;height:90px;border-radius:8px;object-fit:cover
}
.modal-item small{color:var(--muted)}
</style>
</head>

<body>

<div class="topbar">
  <b>📺 EPG Profissional</b>
  <input type="date" id="data">
</div>

<div class="wrapper">
  <div class="channels" id="channels"></div>
  <div class="grid">
    <div class="time-header" id="timeHeader"></div>
    <div id="rows"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-header">
      <input id="filtroNome" placeholder="Buscar conteúdo">
      <select id="filtroCategoria"></select>
    </div>
    <div class="modal-list" id="modalList"></div>
  </div>
</div>

<script>
/* SUPABASE */
const db = window.supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

const DAY = 1440;
let canalSelecionado = null;
let filmesCache = [];

/* HELPERS */
function minToTime(min){
  const h=Math.floor(min/60);
  const m=min%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:00`;
}
function timeToMin(t){
  const [h,m]=t.split(":").map(Number);
  return h*60+m;
}

/* TIME HEADER */
const th=document.getElementById("timeHeader");
for(let h=0;h<24;h++){
  th.innerHTML+=`<div class="time">${String(h).padStart(2,"0")}:00</div>`;
}

/* LOAD BASE */
async function load(){
  const data=document.getElementById("data").value;

  const {data:canais}=await db.from("canais").select("*").order("ordem");
  const ch=document.getElementById("channels");
  const rows=document.getElementById("rows");
  ch.innerHTML=""; rows.innerHTML="";

  canais.forEach(c=>{
    const el=document.createElement("div");
    el.className="channel";
    el.innerText=c.nome;
    el.onclick=()=>selectCanal(c.id,el);
    el.ondblclick=openModal;
    ch.appendChild(el);
    rows.innerHTML+=`<div class="row" data-canal="${c.id}"></div>`;
  });

  const {data:filmes}=await db.from("filmes").select("*").eq("ativo",true);
  filmesCache = filmes;

  popularCategorias();
  renderProgramacao(data);
}

/* SELECT CANAL */
function selectCanal(id,el){
  canalSelecionado=id;
  document.querySelectorAll(".channel").forEach(c=>c.classList.remove("selected"));
  el.classList.add("selected");
}

/* PROGRAMACAO */
async function renderProgramacao(data){
  const {data:prog}=await db
    .from("programacao")
    .select("*,filmes(*)")
    .eq("data",data);

  document.querySelectorAll(".row").forEach(row=>{
    row.innerHTML="";
    const canal=row.dataset.canal;
    prog.filter(p=>p.canal_id===canal).forEach(p=>{
      const ini=timeToMin(p.hora_inicio);
      const fim=timeToMin(p.hora_fim);
      const b=document.createElement("div");
      b.className="block";
      b.style.left=(ini/DAY)*100+"%";
      b.style.width=((fim-ini)/DAY)*100+"%";
      b.innerHTML=`
        <img src="${p.filmes?.capa_url}">
        <b>${p.filmes?.titulo}</b>
        <small>${p.duracao_minutos} min</small>`;
      row.appendChild(b);
    });
  });
}

/* MODAL */
function openModal(){
  if(!canalSelecionado) return alert("Selecione um canal");
  document.getElementById("modal").style.display="flex";
  aplicarFiltro();
}

/* CATEGORIAS */
function popularCategorias(){
  const sel=document.getElementById("filtroCategoria");
  const cats=[...new Set(filmesCache.map(f=>f.categoria).filter(Boolean))];
  sel.innerHTML='<option value="">Todas categorias</option>';
  cats.forEach(c=>sel.innerHTML+=`<option>${c}</option>`);
}

/* FILTRO */
function aplicarFiltro(){
  const nome=document.getElementById("filtroNome").value.toLowerCase();
  const cat=document.getElementById("filtroCategoria").value;
  const list=document.getElementById("modalList");
  list.innerHTML="";

  filmesCache
    .filter(f=>(!nome || f.titulo.toLowerCase().includes(nome)) &&
               (!cat || f.categoria===cat))
    .forEach(f=>{
      const div=document.createElement("div");
      div.className="modal-item";
      div.ondblclick=()=>addConteudo(f);
      div.innerHTML=`
        <img src="${f.capa_url}">
        <div>
          <b>${f.titulo}</b>
          <small>${f.categoria} • ${f.duracao_minutos||120} min</small>
        </div>`;
      list.appendChild(div);
    });
}

/* ADD CONTEUDO */
async function addConteudo(f){
  const data=document.getElementById("data").value;

  const {data:last}=await db.from("programacao")
    .select("*")
    .eq("canal_id",canalSelecionado)
    .eq("data",data)
    .order("hora_fim",{ascending:false})
    .limit(1);

  const inicio = last?.[0] ? timeToMin(last[0].hora_fim) : 0;
  const dur = f.duracao_minutos || 120;

  await db.from("programacao").insert({
    canal_id: canalSelecionado,
    filme_id: f.id,
    data,
    hora_inicio: minToTime(inicio),
    hora_fim: minToTime(inicio + dur),
    duracao_minutos: dur
  });

  document.getElementById("modal").style.display="none";
  load();
}

/* EVENTS */
document.getElementById("filtroNome").oninput=aplicarFiltro;
document.getElementById("filtroCategoria").onchange=aplicarFiltro;

/* INIT */
document.getElementById("data").value=new Date().toISOString().split("T")[0];
load();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>📺 EPG – Grade Linear</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#0b0f17;
  --panel:#0f1420;
  --card:#1c2230;
  --line:#222a3a;
  --content:#2bbcff;
  --ad:#ffb300;
  --text:#fff;
  --muted:#9aa4b2;
}

*{box-sizing:border-box;font-family:Inter,system-ui}

body{
  margin:0;
  background:radial-gradient(circle at top,#101a30,#070a11);
  color:var(--text);
  overflow:hidden;
}

/* TOP */
.topbar{
  height:64px;
  display:flex;
  align-items:center;
  gap:16px;
  padding:0 24px;
  border-bottom:1px solid var(--line);
}

/* LAYOUT */
.wrapper{
  display:grid;
  grid-template-columns:220px 1fr;
  height:calc(100vh - 64px);
}

/* LEFT – CANAIS */
.channels{
  background:var(--panel);
  border-right:1px solid var(--line);
  overflow-y:auto;
}

.channel{
  height:90px;
  display:flex;
  align-items:center;
  padding:0 16px;
  border-bottom:1px solid var(--line);
  font-weight:600;
}

/* RIGHT – GRID */
.grid{
  overflow:auto;
  position:relative;
}

/* TIME HEADER */
.time-header{
  display:flex;
  position:sticky;
  top:0;
  z-index:5;
  background:var(--panel);
  border-bottom:1px solid var(--line);
}

.time{
  min-width:160px;
  text-align:center;
  padding:12px 0;
  font-size:13px;
  color:var(--muted);
  border-left:1px solid var(--line);
}

/* ROW */
.row{
  position:relative;
  height:90px;
  border-bottom:1px solid var(--line);
}

/* BLOCK */
.block{
  position:absolute;
  top:12px;
  height:66px;
  border-radius:12px;
  padding:8px 10px;
  color:#000;
  font-size:13px;
  overflow:hidden;
}

.block.conteudo{background:var(--content)}
.block.publicidade{background:var(--ad)}

.block b{display:block;font-size:14px}
.block small{font-size:11px}
</style>
</head>

<body>

<div class="topbar">
  <b>📺 Grade Linear</b>
  <input type="date" id="data">
</div>

<div class="wrapper">
  <div class="channels" id="channels"></div>

  <div class="grid">
    <div class="time-header" id="timeHeader"></div>
    <div id="rows"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://dxkszikemntfusfyrzos.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DAY = 1440;

/* TIME HEADER */
const timeHeader=document.getElementById("timeHeader");
for(let h=0;h<24;h++){
  timeHeader.innerHTML+=`<div class="time">${String(h).padStart(2,"0")}:00</div>`;
}

/* LOAD CANAIS + GRADE */
async function load(){
  const {data:canais}=await db.from("canais").select("*").order("ordem");
  const ch=document.getElementById("channels");
  const rows=document.getElementById("rows");
  ch.innerHTML=""; rows.innerHTML="";

  canais.forEach(c=>{
    ch.innerHTML+=`<div class="channel">${c.nome}</div>`;
    rows.innerHTML+=`<div class="row" data-canal="${c.id}"></div>`;
  });

  renderProgramacao();
}

/* PROGRAMACAO */
async function renderProgramacao(){
  const data=document.getElementById("data").value;
  const {data:prog}=await db.from("programacao").select("*").eq("data",data);

  document.querySelectorAll(".row").forEach(row=>{
    const canal=row.dataset.canal;
    prog.filter(p=>p.canal_id===canal).forEach(p=>{
      const b=document.createElement("div");
      b.className=`block ${p.tipo}`;
      b.style.left=(p.inicio_minuto/DAY)*100+"%";
      b.style.width=((p.fim_minuto-p.inicio_minuto)/DAY)*100+"%";
      b.innerHTML=`<b>${p.tipo}</b><small>${p.duracao_minutos} min</small>`;
      row.appendChild(b);
    });
  });
}

/* INIT */
document.getElementById("data").value=new Date().toISOString().split("T")[0];
load();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CLENA TV • Filmes e Séries</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="icon" href="logo.png">

<style>
:root{
  --bg:#0b0b0d;
  --red:#e50914;
  --gold:#ffcc66;
  --text:#ffffff;
  --muted:#cfcfcf;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,system-ui,Arial,sans-serif;
}

html,body{
  width:100%;
  height:100%;
  background:
    radial-gradient(80% 60% at 50% 20%, #2a0000 0%, #0b0b0d 60%);
  color:var(--text);
  overflow-x:hidden;
}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:36px 18px;
  text-align:center;
}

/* LOGO */
.logo{
  width:180px;
  margin-bottom:20px;
  filter:drop-shadow(0 10px 30px rgba(229,9,20,.45));
}

/* TITLE */
.hero h1{
  font-size:32px;
  font-weight:900;
  letter-spacing:.5px;
}

.hero h1 span{
  color:var(--gold);
}

.hero p{
  margin-top:10px;
  font-size:16px;
  color:var(--muted);
}

/* DEVICES */
.devices{
  margin:36px 0;
  width:100%;
  max-width:920px;
}

.devices img{
  width:100%;
  display:block;
  filter:drop-shadow(0 35px 70px rgba(229,9,20,.4));
}

/* PRICE */
.price{
  margin-top:18px;
}

.price small{
  display:block;
  font-size:14px;
  color:var(--muted);
}

.price strong{
  display:block;
  font-size:56px;
  font-weight:900;
  color:var(--gold);
  margin:6px 0;
}

/* BADGE */
.badge{
  margin:16px auto 24px;
  background:linear-gradient(135deg,#ffcc66,#ff9900);
  color:#000;
  padding:10px 20px;
  border-radius:999px;
  font-size:14px;
  font-weight:900;
  display:inline-block;
  box-shadow:0 10px 30px rgba(255,204,102,.35);
}

/* CTA */
.cta{
  margin-top:10px;
}

.cta a{
  display:inline-block;
  padding:16px 28px;
  border-radius:14px;
  background:var(--red);
  color:#fff;
  text-decoration:none;
  font-weight:900;
  font-size:16px;
  letter-spacing:.4px;
  box-shadow:0 22px 50px rgba(229,9,20,.45);
  transition:.25s;
}

.cta a:hover{
  transform:translateY(-2px);
  box-shadow:0 30px 70px rgba(229,9,20,.65);
}

/* DESKTOP */
@media(min-width:768px){
  .hero h1{font-size:44px}
  .price strong{font-size:64px}
}
</style>
</head>

<body>

<section class="hero">

  <img src="logo.png" class="logo" alt="CLENA TV">

  <h1>ASSISTA <span>FILMES</span> E <span>SÉRIES</span></h1>
  <p>Onde quiser • Quando quiser • Em qualquer dispositivo</p>

  <div class="devices">
    <img src="device.png" alt="CLENA TV em todos os dispositivos">
  </div>

  <div class="price">
    <small>A partir de</small>
    <strong>R$ 10,99</strong>
    <small>por mês</small>
  </div>

  <div class="badge">🎁 7 DIAS DE TESTE GRÁTIS</div>

  <div class="cta">
    <a href="login.html">ACESSAR AGORA</a>
  </div>

</section>

</body>
</html>

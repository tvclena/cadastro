<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>CLENA TV • AO VIVO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
html, body {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:black;
  overflow:hidden;
  font-family:Inter,system-ui;
}

#player {
  width:100vw;
  height:100vh;
  background:black;
}

#overlay {
  position:absolute;
  top:16px;
  left:16px;
  color:white;
  font-size:14px;
  z-index:10;
}

#overlay span {
  color:#ff3b3b;
}
</style>
</head>

<body>

<div id="overlay">
  🔴 <span>AO VIVO</span> • <span id="canalNome"></span>
</div>

<video id="player" autoplay muted playsinline></video>

<script>
/* ================= CONFIG ================= */

const SUPABASE_URL = "https://dxkszikemntfusfyrzos.supabase.co";
const SUPABASE_KEY = "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed";

const BUNNY_PULL = "https://sessao99.b-cdn.net";

/* CANAL FIXO (depois você pode passar por URL) */
const CANAL = "Terror 24h";

/* ================= INIT ================= */

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

document.getElementById("canalNome").innerText = CANAL;

/* ================= HELPERS ================= */

function minutosAgora(){
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes();
}

/* ================= PLAYER ================= */

async function carregarAoVivo(){

  const hoje = new Date().toISOString().split("T")[0];
  const agoraMin = minutosAgora();

  const { data, error } = await supabase
    .from("programacao")
    .select("*, filmes(*)")
    .eq("canal", CANAL)
    .eq("data", hoje)
    .lte("inicio_minuto", agoraMin)
    .order("inicio_minuto", { ascending: false })
    .limit(1);

  if(error || !data || !data.length){
    console.log("Nenhuma programação agora");
    setTimeout(carregarAoVivo, 10000);
    return;
  }

  const prog = data[0];
  const filme = prog.filmes;

  if(!filme?.video_url){
    console.error("Filme sem video_url");
    return;
  }

  const offsetSegundos =
    (agoraMin - prog.inicio_minuto) * 60;

  tocarVideo(filme.video_url, offsetSegundos);
}

/* ================= TOCAR VIDEO ================= */

function tocarVideo(videoId, startSeconds){

  const video = document.getElementById("player");
  const src = `${BUNNY_PULL}/${videoId}/play.m3u8`;

  if(Hls.isSupported()){
    const hls = new Hls({
      startPosition: startSeconds,
      enableWorker: true,
      lowLatencyMode: true
    });

    hls.loadSource(src);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play();
    });

    video.onended = () => {
      location.reload();
    };

  } else if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src = src;
    video.currentTime = startSeconds;
    video.play();
  }
}

/* ================= START ================= */

carregarAoVivo();

/* REVALIDA A CADA 1 MINUTO */
setInterval(carregarAoVivo, 60000);
</script>

</body>
</html>

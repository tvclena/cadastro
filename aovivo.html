<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sessão • AO VIVO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,body{
  margin:0;
  background:#000;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Inter,Arial,sans-serif;
}
#live{
  position:absolute;
  top:16px;
  left:16px;
  z-index:10;
  background:rgba(0,0,0,.6);
  color:#fff;
  padding:8px 14px;
  border-radius:999px;
  font-size:14px;
}
iframe{
  width:100%;
  height:100%;
  border:0;
}
</style>
</head>

<body>

<div id="live">🔴 AO VIVO • Terror 24h</div>
<iframe id="player" allow="autoplay; fullscreen"></iframe>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= CONFIG ================= */
const LIBRARY_ID = "569072";
const CANAL = "Terror 24h";

const sb = supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

const iframe = document.getElementById("player");

/* ================= HELPERS ================= */
function agoraMin(){
  const d = new Date();
  return d.getHours() * 60 + d.getMinutes();
}
function hoje(){
  return new Date().toISOString().split("T")[0];
}

/* ================= AO VIVO ================= */
async function carregarAoVivo(){
  const min = agoraMin();

  const { data } = await sb
    .from("programacao")
    .select("inicio_minuto,duracao_minutos,filmes(video_url,titulo)")
    .eq("canal", CANAL)
    .eq("data", hoje())
    .order("inicio_minuto");

  if(!data || !data.length) return;

  const atual = data.find(p =>
    min >= p.inicio_minuto &&
    min < p.inicio_minuto + p.duracao_minutos
  );

  if(!atual) return;

  const src =
    `https://iframe.mediadelivery.net/embed/${LIBRARY_ID}/${atual.filmes.video_url}?autoplay=true`;

  if(iframe.src !== src){
    iframe.src = src;
  }

  const restante = (atual.inicio_minuto + atual.duracao_minutos - min) * 60000;
  setTimeout(carregarAoVivo, restante + 1000);
}

carregarAoVivo();
</script>

</body>
</html>

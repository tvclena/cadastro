<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>CLENA TV • AO VIVO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: black;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

#player {
  width: 100vw;
  height: 100vh;
  object-fit: cover;
}

#live {
  position: fixed;
  top: 15px;
  left: 15px;
  color: red;
  font-weight: bold;
  font-family: Arial;
  z-index: 10;
}
</style>
</head>

<body>

<div id="live">🔴 AO VIVO • Terror 24h</div>
<video id="player" autoplay muted playsinline></video>

<script>
// ============================
// SUPABASE (UMA ÚNICA VEZ)
// ============================
const supabase = supabaseJs.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

// ============================
// PLAYER
// ============================
const video = document.getElementById("player");
let hls;

// ============================
// FUNÇÃO PRINCIPAL
// ============================
async function carregarAoVivo() {
  const agora = new Date();
  const dataHoje = agora.toISOString().slice(0,10);
  const minutoAtual = agora.getHours() * 60 + agora.getMinutes();

  const { data, error } = await supabase
    .from("programacao")
    .select(`
      inicio_minuto,
      duracao_minutos,
      filmes ( titulo, video_url )
    `)
    .eq("canal", "Terror 24h")
    .eq("data", dataHoje);

  if (error || !data) {
    console.error("Erro Supabase", error);
    return;
  }

  const atual = data.find(p =>
    minutoAtual >= p.inicio_minuto &&
    minutoAtual < p.inicio_minuto + p.duracao_minutos
  );

  if (!atual) return;

  iniciarPlayer(atual.filmes.video_url);
}

// ============================
// INICIAR HLS
// ============================
function iniciarPlayer(url) {
  if (hls) hls.destroy();

  if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play();
    });
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = url;
    video.play();
  }
}

// ============================
// LOOP AO VIVO
// ============================
carregarAoVivo();
setInterval(carregarAoVivo, 30000); // verifica a cada 30s
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Terror 24h • Ao Vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
html,body{
  margin:0;
  background:black;
  height:100%;
  overflow:hidden;
}
video{
  width:100vw;
  height:100vh;
  object-fit:cover;
  background:black;
}
.overlay{
  position:absolute;
  top:16px;
  left:16px;
  color:white;
  font-family:Inter,system-ui;
  font-size:18px;
  opacity:.85;
  z-index:10;
}
</style>
</head>

<body>

<div class="overlay">🔴 Terror 24h • AO VIVO</div>
<video id="player" autoplay muted playsinline></video>

<script>
/* ===================== */
/* SUPABASE (NOME SEGURO) */
/* ===================== */
const db = window.supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

const CANAL = "Terror 24h";
const player = document.getElementById("player");

/* ===================== */
/* TEMPO ATUAL EM MINUTOS */
/* ===================== */
function agoraMin(){
  const d = new Date();
  return d.getHours() * 60 + d.getMinutes();
}

/* ===================== */
/* AO VIVO */
/* ===================== */
async function carregarAoVivo(){
  const hoje = new Date().toISOString().split("T")[0];
  const agora = agoraMin();

  const { data, error } = await db
    .from("programacao")
    .select("*, filmes(*)")
    .eq("canal", CANAL)
    .eq("data", hoje)
    .order("inicio_minuto");

  if(error){
    console.error("Erro Supabase:", error);
    return;
  }

  if(!data || !data.length){
    console.warn("Sem programação hoje");
    return;
  }

  const atual = data.find(p =>
    agora >= p.inicio_minuto &&
    agora < (p.inicio_minuto + p.duracao_minutos)
  );

  if(!atual){
    console.warn("Nada ao vivo neste horário");
    return;
  }

  const segundos = (agora - atual.inicio_minuto) * 60;
  tocar(atual, data, segundos);
}

/* ===================== */
/* PLAYER */
/* ===================== */
function tocar(item, lista, start){
  player.src = item.filmes.video_url;
  player.currentTime = start;
  player.muted = true;
  player.play();

  player.onended = () => {
    const idx = lista.findIndex(i => i.id === item.id);
    const prox = lista[idx + 1];
    if(prox){
      tocar(prox, lista, 0);
    } else {
      setTimeout(carregarAoVivo, 3000);
    }
  };
}

carregarAoVivo();
</script>

</body>
</html>

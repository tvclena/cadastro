<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sessão • AO VIVO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,body{
  margin:0;
  background:#000;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Inter,Arial,sans-serif;
}

#live{
  position:absolute;
  top:16px;
  left:16px;
  z-index:10;
  background:rgba(0,0,0,.65);
  color:#fff;
  padding:8px 16px;
  border-radius:999px;
  font-size:14px;
  font-weight:600;
}

iframe{
  width:100%;
  height:100%;
  border:0;
}
</style>
</head>

<body>

<div id="live">🔴 AO VIVO • Terror 24h</div>
<iframe
  id="player"
  allow="autoplay; fullscreen"
  allowfullscreen
  referrerpolicy="no-referrer">
</iframe>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= CONFIG ================= */
const LIBRARY_ID = "569072";
const CANAL = "Terror 24h";

const sb = supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

const iframe = document.getElementById("player");

/* ================= TEMPO ================= */
function agoraMinutos(){
  const d = new Date();
  return d.getHours() * 60 + d.getMinutes();
}
function hoje(){
  return new Date().toISOString().split("T")[0];
}

/* ================= AO VIVO ================= */
async function carregarAoVivo(){
  const agora = agoraMinutos();

  const { data, error } = await sb
    .from("programacao")
    .select(`
      inicio_minuto,
      duracao_minutos,
      filmes(video_url,titulo)
    `)
    .eq("canal", CANAL)
    .eq("data", hoje())
    .order("inicio_minuto");

  if(error || !data || !data.length) return;

  const atual = data.find(p =>
    agora >= p.inicio_minuto &&
    agora < p.inicio_minuto + p.duracao_minutos
  );

  if(!atual) return;

  /* SEGUNDOS JÁ TRANSCORRIDOS */
  const offsetSegundos =
    Math.max(0, (agora - atual.inicio_minuto) * 60);

  const src =
    `https://iframe.mediadelivery.net/embed/${LIBRARY_ID}/${atual.filmes.video_url}` +
    `?autoplay=1&muted=1&t=${offsetSegundos}`;

  if(iframe.src !== src){
    iframe.src = src;
  }

  /* AGENDAR TROCA AUTOMÁTICA */
  const restanteMs =
    ((atual.inicio_minuto + atual.duracao_minutos) - agora) * 60000;

  setTimeout(carregarAoVivo, restanteMs + 1500);
}

/* INICIAR */
carregarAoVivo();
</script>

</body>
</html>

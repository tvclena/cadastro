<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>📺 Canal Ao Vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- HLS -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
html,body{
  margin:0;
  background:#000;
  color:#fff;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Inter,system-ui;
}
#player{
  width:100vw;
  height:100vh;
  background:#000;
}
.top{
  position:absolute;
  top:12px;
  left:12px;
  z-index:10;
  background:rgba(0,0,0,.6);
  padding:8px 14px;
  border-radius:10px;
  font-weight:600;
}
.live{
  color:#ff3b3b;
  margin-right:6px;
}
</style>
</head>

<body>

<div class="top">
  <span class="live">● AO VIVO</span>
  <span id="canalNome">Canal</span>
</div>

<video
  id="player"
  autoplay
  muted
  playsinline
  preload="auto"
  disablepictureinpicture
  controlslist="nodownload nofullscreen noremoteplayback">
</video>

<script>
/* ==========================
   CONFIGURAÇÃO
========================== */

// 🔴 TROQUE AQUI
const SUPABASE_URL = "https://dxkszikemntfusfyrzos.supabase.co";
const SUPABASE_KEY = "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed";

// 🔴 TROQUE PELO SEU PULL ZONE
const BUNNY_PULL = "vz-XXXXXX"; // ex: vz-9f3a2e

// 🔴 CANAL ATUAL
const CANAL = "Terror 24h";

/* ==========================
   SUPABASE
========================== */
const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const player = document.getElementById("player");
document.getElementById("canalNome").innerText = CANAL;

let hls;

/* ==========================
   HELPERS
========================== */
function minutoAgora(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}

function dataHoje(){
  return new Date().toISOString().split("T")[0];
}

/* ==========================
   PLAYER
========================== */
function tocarVideo(videoId){
  const url = `https://${BUNNY_PULL}.b-cdn.net/${videoId}/play.m3u8`;

  if(hls){
    hls.destroy();
    hls = null;
  }

  if(Hls.isSupported()){
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(player);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      player.play().catch(()=>{});
    });
  } else {
    player.src = url;
    player.play().catch(()=>{});
  }
}

/* ==========================
   BUSCAR PROGRAMAÇÃO ATUAL
========================== */
async function carregarAoVivo(){
  const minuto = minutoAgora();
  const hoje = dataHoje();

  const { data, error } = await supabase
    .from("programacao")
    .select(`
      inicio_minuto,
      duracao_minutos,
      filmes (
        titulo,
        video_url
      )
    `)
    .eq("canal", CANAL)
    .eq("data", hoje)
    .lte("inicio_minuto", minuto)
    .order("inicio_minuto", { ascending:false })
    .limit(1);

  if(error || !data || !data.length) return;

  const item = data[0];
  const fim = item.inicio_minuto + item.duracao_minutos;

  if(minuto >= fim) return;

  tocarVideo(item.filmes.video_url);

  // agenda troca automática
  const segundosRestantes = (fim - minuto) * 60;
  setTimeout(carregarAoVivo, segundosRestantes * 1000 + 1000);
}

/* ==========================
   START
========================== */
carregarAoVivo();
setInterval(carregarAoVivo, 60000); // segurança
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CLENA TV • AO VIVO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- SUPABASE SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- HLS -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:black;
  overflow:hidden;
  font-family:Inter,system-ui;
}

#player{
  width:100vw;
  height:100vh;
  background:black;
}

#info{
  position:fixed;
  top:16px;
  left:16px;
  color:white;
  z-index:10;
  font-size:14px;
}

#info span{
  color:#ff3b3b;
}
</style>
</head>

<body>

<div id="info">🔴 <span>AO VIVO</span> • Terror 24h</div>

<video id="player" autoplay muted playsinline></video>

<script>
/* ================= CONFIG ================= */

const SUPABASE_URL = "https://dxkszikemntfusfyrzos.supabase.co";
const SUPABASE_KEY = "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed";

/* BUNNY CDN */
const BUNNY_PULL = "https://sessao99.b-cdn.net";

/* CANAL */
const CANAL = "Terror 24h";

/* ================= INIT ================= */

/* ⚠️ NÃO use const supabase */
const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* ================= HELPERS ================= */

function minutosAgora(){
  const n = new Date();
  return n.getHours()*60 + n.getMinutes();
}

/* ================= PLAYER ================= */

async function iniciarAoVivo(){

  const hoje = new Date().toISOString().split("T")[0];
  const agora = minutosAgora();

  const { data, error } = await db
    .from("programacao")
    .select("*, filmes(*)")
    .eq("canal", CANAL)
    .eq("data", hoje)
    .lte("inicio_minuto", agora)
    .order("inicio_minuto", { ascending:false })
    .limit(1);

  if(error || !data || !data.length){
    console.log("Sem programação ativa");
    setTimeout(iniciarAoVivo, 10000);
    return;
  }

  const prog = data[0];
  const filme = prog.filmes;

  if(!filme?.video_url){
    console.error("Sem video_url");
    return;
  }

  const offset = (agora - prog.inicio_minuto) * 60;
  tocarBunny(filme.video_url, offset);
}

/* ================= BUNNY ================= */

function tocarBunny(videoId, start){

  const video = document.getElementById("player");
  const src = `${BUNNY_PULL}/${videoId}/play.m3u8`;

  if(Hls.isSupported()){
    const hls = new Hls({
      startPosition:start,
      lowLatencyMode:true
    });

    hls.loadSource(src);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, ()=>{
      video.play();
    });

    video.onended = ()=> location.reload();

  }else{
    video.src = src;
    video.currentTime = start;
    video.play();
  }
}

/* ================= START ================= */

iniciarAoVivo();

/* REVALIDA A CADA 1 MINUTO */
setInterval(iniciarAoVivo, 60000);
</script>

</body>
</html>

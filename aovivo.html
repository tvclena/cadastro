<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Terror 24h • Ao Vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
html,body{
  margin:0;
  background:black;
  height:100%;
}
video{
  width:100vw;
  height:100vh;
  object-fit:cover;
  background:black;
}
.overlay{
  position:absolute;
  top:16px;
  left:16px;
  color:white;
  font-family:Inter,system-ui;
  font-size:18px;
  opacity:.85;
}
</style>
</head>
<body>

<div class="overlay">🔴 Terror 24h • AO VIVO</div>
<video id="player" autoplay muted playsinline></video>

<script>
const supabase = window.supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "SUA_ANON_KEY_AQUI"
);

const CANAL = "Terror 24h";
const player = document.getElementById("player");

/* ===================== */
/* TEMPO ATUAL EM MINUTOS */
/* ===================== */
function agoraEmMinutos(){
  const d = new Date();
  return d.getHours() * 60 + d.getMinutes();
}

/* ===================== */
/* CARREGAR AO VIVO */
/* ===================== */
async function carregarAoVivo(){
  const hoje = new Date().toISOString().split("T")[0];
  const agora = agoraEmMinutos();

  const { data: lista } = await supabase
    .from("programacao")
    .select("*, filmes(*)")
    .eq("canal", CANAL)
    .eq("data", hoje)
    .order("inicio_minuto");

  if(!lista || !lista.length){
    console.warn("Sem programação");
    return;
  }

  const atual = lista.find(p =>
    agora >= p.inicio_minuto &&
    agora < (p.inicio_minuto + p.duracao_minutos)
  );

  if(!atual){
    console.warn("Nada ao vivo neste horário");
    return;
  }

  const segundos = (agora - atual.inicio_minuto) * 60;

  iniciarVideo(atual.filmes.video_url, segundos, lista, atual);
}

/* ===================== */
/* INICIAR PLAYER */
/* ===================== */
function iniciarVideo(url, start, lista, atual){
  player.src = url;
  player.currentTime = start;
  player.muted = true;
  player.play();

  player.onended = () => {
    const idx = lista.findIndex(i => i.id === atual.id);
    const proximo = lista[idx + 1];
    if(proximo){
      iniciarVideo(proximo.filmes.video_url, 0, lista, proximo);
    } else {
      setTimeout(carregarAoVivo, 5000);
    }
  };
}

carregarAoVivo();
</script>

</body>
</html>

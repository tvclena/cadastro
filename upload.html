<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CLENA TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
:root{
  --bg:#05070f;
  --panel:#0f1424;
  --card:#151a30;
  --input:#0b1020;
  --accent:#dc2626;
  --accent-dark:#991b1b;
  --danger:#7f1d1d;
  --text:#e5e7eb;
  --muted:#9ca3af;
}
*{box-sizing:border-box}
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  background:linear-gradient(180deg,#05060c,#07090f);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}
.wrapper{
  height:100vh;
  padding:16px 20px;
  display:grid;
  grid-template-columns:360px 1fr;
  gap:16px;
}
.panel{
  background:var(--panel);
  border-radius:16px;
  padding:16px;
  display:flex;
  flex-direction:column;
}
h3{margin:0 0 10px}
label{font-size:12px;margin-top:8px;font-weight:600}
input,textarea,select{
  width:100%;
  margin-top:4px;
  padding:8px 10px;
  border-radius:8px;
  border:none;
  background:var(--input);
  color:#fff;
}
textarea{resize:none;height:60px}
button{
  margin-top:12px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
}
button:hover{background:var(--accent-dark)}
.hidden{display:none}

/* LISTA */
.list{flex:1;overflow-y:auto}
.grid{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:8px;
}
.card{
  background:var(--card);
  border-radius:10px;
  overflow:hidden;
  font-size:11px;
  cursor:pointer;
}
.card img{
  width:100%;
  height:110px;
  object-fit:cover;
}
.card .box{padding:6px}
.card small{color:var(--muted)}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.modal-box{
  width:540px;
  background:var(--panel);
  border-radius:18px;
  overflow:hidden;
}
.modal-cover{
  height:220px;
}
.modal-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.modal-body{padding:16px}
.episodio-row{
  display:grid;
  grid-template-columns:60px 1fr auto;
  gap:8px;
  margin-top:8px;
}
.episodio-row button{
  background:var(--danger);
  padding:6px 10px;
}
.add-ep{
  background:#1f2937;
}
.modal-actions{
  display:flex;
  gap:10px;
  margin-top:14px;
}
.modal-actions button:last-child{
  background:#1f2937;
}
</style>
</head>

<body>

<div class="wrapper">

<!-- FORM NOVO -->
<div class="panel">
  <h3>Novo</h3>
  <input id="titulo" placeholder="Título">
  <textarea id="descricao" placeholder="Descrição"></textarea>
  <input id="categoria" placeholder="Categoria">
  <input id="capa" placeholder="URL da capa">
  <input id="videoId" placeholder="ID do vídeo (filme)">
  <select id="tipo">
    <option value="filme">Filme</option>
    <option value="serie">Série</option>
  </select>
  <button onclick="salvarNovo()">Salvar</button>
</div>

<!-- LISTA -->
<div class="panel">
  <div id="status">Carregando…</div>
  <div class="list">
    <div id="lista" class="grid"></div>
  </div>
</div>

</div>

<!-- MODAL EDIÇÃO -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-cover">
      <img id="mCapa">
    </div>
    <div class="modal-body">
      <input id="mTitulo">
      <textarea id="mDescricao"></textarea>
      <input id="mCategoria">

      <div id="boxEpisodios" class="hidden">
        <h4>Episódios</h4>
        <div id="listaEps"></div>
        <button class="add-ep" onclick="addEp()">➕ Adicionar episódio</button>
      </div>

      <div class="modal-actions">
        <button onclick="salvarEdicao()">Salvar</button>
        <button onclick="fecharModal()">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<script>
const supabaseClient = supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

let registros=[], atual=null;

async function carregar(){
  const {data}=await supabaseClient.from("filmes").select("*").order("created_at",{ascending:false});
  registros=data||[];
  status.textContent=`${registros.length} registros`;
  render();
}

function render(){
  lista.innerHTML="";
  registros.forEach(r=>{
    const d=document.createElement("div");
    d.className="card";
    d.ondblclick=()=>abrirModal(r);
    d.innerHTML=`
      <img src="${r.capa_url}">
      <div class="box">
        <b>${r.titulo}</b><br>
        <small>${r.tipo}${r.episodio?" • Ep "+r.episodio:""}</small>
      </div>`;
    lista.appendChild(d);
  });
}

function abrirModal(r){
  atual=r;
  modal.classList.remove("hidden");
  mCapa.src=r.capa_url;
  mTitulo.value=r.titulo;
  mDescricao.value=r.descricao||"";
  mCategoria.value=r.categoria||"";
  listaEps.innerHTML="";

  if(r.tipo==="serie"){
    boxEpisodios.classList.remove("hidden");
    registros
      .filter(e=>e.tipo==="serie" && e.serie_nome===r.serie_nome)
      .sort((a,b)=>a.episodio-b.episodio)
      .forEach(e=>addEp(e.episodio,e.video_url));
  }else{
    boxEpisodios.classList.add("hidden");
  }
}

function addEp(ep="",vid=""){
  const n=listaEps.children.length+1;
  const div=document.createElement("div");
  div.className="episodio-row";
  div.innerHTML=`
    <input type="number" value="${ep||n}">
    <input placeholder="ID do vídeo" value="${vid}">
    <button onclick="this.parentNode.remove()">✖</button>
  `;
  listaEps.appendChild(div);
}

async function salvarEdicao(){
  await supabaseClient.from("filmes")
    .delete().eq("serie_nome",atual.serie_nome||atual.titulo);

  const inserts=[...listaEps.children].map(r=>({
    titulo:mTitulo.value,
    descricao:mDescricao.value,
    categoria:mCategoria.value,
    capa_url:atual.capa_url,
    video_url:r.children[1].value,
    tipo:"serie",
    serie_nome:mTitulo.value,
    episodio:r.children[0].value,
    ativo:true
  }));

  await supabaseClient.from("filmes").insert(inserts);
  fecharModal();
  carregar();
}

function fecharModal(){modal.classList.add("hidden")}

async function salvarNovo(){
  await supabaseClient.from("filmes").insert({
    titulo:titulo.value,
    descricao:descricao.value,
    categoria:categoria.value,
    capa_url:capa.value,
    video_url:videoId.value,
    tipo:tipo.value,
    ativo:true
  });
  carregar();
}

carregar();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CLENA TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
:root{
  --bg:#05070f;
  --panel:#0f1424;
  --card:#151a30;
  --input:#0b1020;
  --accent:#6366f1;
  --ok:#22c55e;
  --err:#ef4444;
  --text:#e5e7eb;
  --muted:#9ca3af;
}
*{box-sizing:border-box}
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  background:linear-gradient(180deg,#05060c,#07090f);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}

.wrapper{
  height:100vh;
  padding:16px 20px;
  display:grid;
  grid-template-columns:360px 1fr;
  gap:16px;
}

/* PANELS */
.panel{
  background:var(--panel);
  border-radius:16px;
  padding:16px;
  display:flex;
  flex-direction:column;
  min-height:0;
}
.form-panel{
  overflow-y:auto;
}
.form-panel::-webkit-scrollbar{
  width:6px;
}
.form-panel::-webkit-scrollbar-thumb{
  background:#1f2937;
  border-radius:6px;
}

/* FORM */
h3{margin:0 0 10px}
label{font-size:12px;margin-top:8px;font-weight:600}
input,textarea,select{
  width:100%;
  margin-top:4px;
  padding:8px 10px;
  border-radius:8px;
  border:none;
  background:var(--input);
  color:#fff;
  font-size:13px;
}
textarea{resize:none;height:60px}
button{
  margin-top:12px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  color:#fff;
  font-size:14px;
  cursor:pointer;
}
.hidden{display:none}

/* LIST */
.filters{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:8px;
  margin-bottom:10px;
}
.list{
  flex:1;
  overflow-y:auto;
  padding-right:6px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:8px;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:10px;
  overflow:hidden;
  font-size:11px;
}
.card img{
  width:100%;
  height:110px;
  object-fit:cover;
}
.card .box{padding:6px}
.card h4{
  margin:0;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.card small{color:var(--muted)}

/* EPISÓDIOS */
.episodio-row{
  display:grid;
  grid-template-columns:1fr 2fr auto;
  gap:6px;
  margin-top:6px;
}
.episodio-row button{
  background:#7f1d1d;
  padding:6px 8px;
}
</style>
</head>

<body>

<div class="wrapper">

<!-- FORM -->
<div class="panel form-panel">
  <h3>Novo / Editar</h3>

  <label>Título</label>
  <input id="titulo">

  <label>Descrição</label>
  <textarea id="descricao"></textarea>

  <label>Categoria</label>
  <input id="categoria">

  <label>URL da Capa</label>
  <input id="capa">

  <label>ID do Vídeo (Filme)</label>
  <input id="videoId">

  <label>Tipo</label>
  <select id="tipo" onchange="toggleSerie()">
    <option value="filme">Filme</option>
    <option value="serie">Série</option>
  </select>

  <!-- SÉRIE -->
  <div id="serieBox" class="hidden">

    <label>Temporada</label>
    <input id="temporada" type="number">

    <div style="margin-top:10px;font-size:13px;font-weight:600">
      Episódios
    </div>

    <div id="episodios"></div>

    <button type="button" onclick="addEpisodio()" style="background:#1f2937">
      ➕ Adicionar episódio
    </button>

  </div>

  <button onclick="salvar()">Salvar</button>
</div>

<!-- LIST -->
<div class="panel">
  <div id="status">Carregando…</div>

  <div class="filters">
    <input id="search" placeholder="Buscar título">
    <select id="fTipo">
      <option value="">Tipo</option>
      <option value="filme">Filme</option>
      <option value="serie">Série</option>
    </select>
    <input id="fCategoria" placeholder="Categoria">
  </div>

  <div class="list">
    <div id="lista" class="grid"></div>
  </div>
</div>

</div>

<script>
const supabaseClient = window.supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

let filmes=[];
const lista=document.getElementById("lista");
const statusEl=document.getElementById("status");

function toggleSerie(){
  serieBox.classList.toggle("hidden", tipo.value!=="serie");
  if(tipo.value==="serie" && episodios.children.length===0){
    addEpisodio();
  }
}

function addEpisodio(ep="",vid=""){
  const div=document.createElement("div");
  div.className="episodio-row";
  div.innerHTML=`
    <input type="number" placeholder="Ep." value="${ep}">
    <input placeholder="ID do vídeo" value="${vid}">
    <button onclick="this.parentNode.remove()">✖</button>
  `;
  episodios.appendChild(div);
}

async function carregar(){
  const {data}=await supabaseClient
    .from("filmes")
    .select("*")
    .order("created_at",{ascending:false});
  filmes=data||[];
  statusEl.textContent=`${filmes.length} registros`;
  render();
}

function render(){
  lista.innerHTML="";
  const s=search.value.toLowerCase();
  const t=fTipo.value;
  const c=fCategoria.value.toLowerCase();

  filmes.filter(f=>{
    return (!s||f.titulo.toLowerCase().includes(s))
      &&(!t||f.tipo===t)
      &&(!c||f.categoria?.toLowerCase().includes(c));
  }).forEach(f=>{
    const d=document.createElement("div");
    d.className="card";
    d.innerHTML=`
      <img src="${f.capa_url}">
      <div class="box">
        <h4>${f.titulo}</h4>
        <small>${f.tipo}${f.episodio ? " • Ep "+f.episodio : ""}</small>
      </div>`;
    lista.appendChild(d);
  });
}

async function salvar(){

  if(tipo.value==="filme"){
    await supabaseClient.from("filmes").insert({
      titulo:titulo.value,
      descricao:descricao.value,
      categoria:categoria.value,
      capa_url:capa.value,
      video_url:videoId.value,
      tipo:"filme",
      ativo:true
    });
    location.reload();
    return;
  }

  const rows=[...episodios.children];
  const inserts=[];

  rows.forEach(r=>{
    const ep=r.children[0].value;
    const vid=r.children[1].value;
    if(ep && vid){
      inserts.push({
        titulo:titulo.value,
        descricao:descricao.value,
        categoria:categoria.value,
        capa_url:capa.value,
        video_url:vid,
        tipo:"serie",
        serie_nome:titulo.value,
        temporada:temporada.value||null,
        episodio:ep,
        ativo:true
      });
    }
  });

  if(inserts.length===0){
    alert("Adicione pelo menos um episódio");
    return;
  }

  await supabaseClient.from("filmes").insert(inserts);
  location.reload();
}

search.oninput=render;
fTipo.onchange=render;
fCategoria.oninput=render;

carregar();
</script>

</body>
</html>

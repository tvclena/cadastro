<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CLENA TV • Filmes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
:root{
  --bg:#05070f;
  --panel:#0f1424;
  --card:#151a30;
  --input:#0b1020;
  --accent:#e50914;
  --ok:#22c55e;
  --err:#ef4444;
  --text:#e5e7eb;
  --muted:#9ca3af;
}
*{box-sizing:border-box}
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  background:linear-gradient(180deg,#05060c,#07090f);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}

.wrapper{
  height:100vh;
  padding:16px 20px;
  display:grid;
  grid-template-columns:360px 1fr;
  gap:16px;
}

/* PANEL */
.panel{
  background:var(--panel);
  border-radius:16px;
  padding:16px;
  display:flex;
  flex-direction:column;
}
h3{margin:0 0 10px}

/* FORM */
label{font-size:12px;margin-top:8px;font-weight:600}
input,textarea,select{
  width:100%;
  margin-top:4px;
  padding:8px 10px;
  border-radius:8px;
  border:none;
  background:var(--input);
  color:#fff;
  font-size:13px;
}
textarea{resize:none;height:60px}

button{
  margin-top:12px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  color:#fff;
  font-size:14px;
  cursor:pointer;
}

/* CAPA */
.capa-preview{
  margin-top:8px;
  width:100%;
  height:160px;
  border-radius:10px;
  background:#000;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px dashed #333;
}
.capa-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.capa-preview span{
  font-size:12px;
  color:var(--muted);
}

/* LIST */
.filters{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:8px;
  margin-bottom:10px;
}
.list{
  flex:1;
  overflow-y:auto;
  padding-right:6px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:8px;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:10px;
  overflow:hidden;
  font-size:11px;
}
.card img{
  width:100%;
  height:110px;
  object-fit:cover;
}
.card .box{padding:6px}
.card h4{
  margin:0;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.card small{color:var(--muted)}
.actions{
  display:flex;
  gap:4px;
  margin-top:4px;
}
.actions button{
  padding:4px;
  font-size:10px;
}
.danger{background:#7f1d1d}
.toggle{background:#111827}

/* STATUS */
.status{font-size:13px;margin-bottom:8px}
.ok{color:var(--ok)}
.err{color:var(--err)}
.hidden{display:none}
</style>
</head>

<body>

<div class="wrapper">

<!-- FORM -->
<div class="panel">
  <h3>Novo / Editar</h3>
  <input type="hidden" id="editId">

  <label>Título</label>
  <input id="titulo">

  <label>Descrição</label>
  <textarea id="descricao"></textarea>

  <label>Categoria</label>
  <input id="categoria" list="categorias">

  <datalist id="categorias">
    <option>Romance</option><option>Suspense</option><option>Terror</option>
    <option>Ação</option><option>Aventura</option><option>Drama</option>
    <option>Comédia</option><option>Ficção Científica</option>
    <option>Fantasia</option><option>Documentário</option>
    <option>Animação</option><option>Policial</option>
    <option>Thriller</option><option>Mistério</option>
    <option>Guerra</option><option>Musical</option><option>Biografia</option>
  </datalist>

  <label>URL da Capa (opcional)</label>
  <input id="capaUrl" oninput="previewCapaUrl()">

  <label>Ou Arquivo da Capa</label>
  <input type="file" id="capaFile" accept="image/*" onchange="uploadCapa()">

  <div class="capa-preview" id="capaPreview">
    <span>Preview da capa</span>
  </div>

  <label>ID do Vídeo</label>
  <input id="videoId">

  <label>Tipo</label>
  <select id="tipo" onchange="toggleSerie()">
    <option value="filme">Filme</option>
    <option value="serie">Série</option>
  </select>

  <div id="serieBox" class="hidden">
    <label>Série</label>
    <input id="serie_nome">
    <label>Temporada</label>
    <input id="temporada" type="number">
    <label>Episódio</label>
    <input id="episodio" type="number">
  </div>

  <button onclick="salvar()">Salvar</button>
</div>

<!-- LIST -->
<div class="panel">
  <div class="status" id="status">Carregando…</div>

  <div class="filters">
    <input id="search" placeholder="Buscar título">
    <select id="fTipo">
      <option value="">Tipo</option>
      <option value="filme">Filme</option>
      <option value="serie">Série</option>
    </select>
    <input id="fCategoria" placeholder="Categoria">
  </div>

  <div class="list">
    <div id="lista" class="grid"></div>
  </div>
</div>

</div>

<script>
const sb = supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

let filmes=[];
let capaFinal="";
const lista=document.getElementById("lista");
const statusEl=document.getElementById("status");

/* PREVIEW VIA URL */
function previewCapaUrl(){
  const url=capaUrl.value.trim();
  if(!url) return;
  capaFinal=url;
  capaPreview.innerHTML=`<img src="${url}">`;
}

/* UPLOAD PARA SUPABASE STORAGE */
async function uploadCapa(){
  const file=capaFile.files[0];
  if(!file) return;

  // preview local
  const reader=new FileReader();
  reader.onload=e=>{
    capaPreview.innerHTML=`<img src="${e.target.result}">`;
  };
  reader.readAsDataURL(file);

  const filePath=`filmes/${Date.now()}-${file.name.replace(/\s+/g,"")}`;

  const { error } = await sb
    .storage
    .from("capas")
    .upload(filePath, file, {
      upsert:true,
      contentType:file.type
    });

  if(error){
    alert("Erro ao enviar capa");
    return;
  }

  const { data } = sb
    .storage
    .from("capas")
    .getPublicUrl(filePath);

  capaFinal=data.publicUrl;
}

/* TOGGLE SÉRIE */
function toggleSerie(){
  serieBox.classList.toggle("hidden", tipo.value!=="serie");
}

/* CARREGAR LISTA */
async function carregar(){
  const {data}=await sb.from("filmes").select("*").order("created_at",{ascending:false});
  filmes=data||[];
  statusEl.textContent=`${filmes.length} registros`;
  render();
}

function render(){
  lista.innerHTML="";
  const s=search.value.toLowerCase();
  const t=fTipo.value;
  const c=fCategoria.value.toLowerCase();

  filmes.filter(f=>{
    return (!s||f.titulo.toLowerCase().includes(s))
      &&(!t||f.tipo===t)
      &&(!c||f.categoria?.toLowerCase().includes(c));
  }).forEach(f=>{
    lista.innerHTML+=`
      <div class="card">
        <img src="${f.capa_url}">
        <div class="box">
          <h4>${f.titulo}</h4>
          <small>${f.categoria||""}</small>
        </div>
      </div>`;
  });
}

/* SALVAR */
async function salvar(){
  if(!capaFinal){
    alert("Informe a capa por URL ou arquivo");
    return;
  }

  const payload={
    titulo:titulo.value,
    descricao:descricao.value,
    categoria:categoria.value,
    capa_url:capaFinal,
    video_url:videoId.value,
    tipo:tipo.value,
    ativo:true
  };

  if(tipo.value==="serie"){
    payload.serie_nome=serie_nome.value;
    payload.temporada=temporada.value||null;
    payload.episodio=episodio.value||null;
  }

  if(editId.value){
    await sb.from("filmes").update(payload).eq("id",editId.value);
  }else{
    await sb.from("filmes").insert(payload);
  }

  location.reload();
}

search.oninput=render;
fTipo.onchange=render;
fCategoria.oninput=render;

carregar();
</script>

</body>
</html>

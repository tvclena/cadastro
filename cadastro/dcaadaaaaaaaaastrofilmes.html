<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CLENA TV • Conteúdos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
:root{
  --bg:#ffffff;
  --panel:#f3f4f6;
  --card:#ffffff;
  --border:#d1d5db;
  --text:#000000;
  --accent:#dc2626;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,Arial;color:var(--text)}
.wrapper{height:100vh;padding:16px;display:grid;grid-template-columns:420px 1fr;gap:16px}
.panel{background:var(--panel);border-radius:14px;padding:16px;display:flex;flex-direction:column}
h3{margin:0 0 10px}
label{font-size:13px;font-weight:600;margin-top:10px}
input,textarea,select{
  width:100%;margin-top:4px;padding:10px;border-radius:8px;
  border:1px solid var(--border)
}
button{
  margin-top:14px;padding:12px;border:none;border-radius:10px;
  background:var(--accent);color:#fff;font-weight:700;cursor:pointer
}
.secondary{background:#6b7280}
.danger{background:#991b1b}

.filters{display:flex;gap:8px;margin-bottom:12px}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:pointer}
.card img{width:100%;height:200px;object-fit:cover}
.card .box{padding:10px;font-weight:600}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:999}
.modal-box{width:920px;max-height:90vh;background:#fff;border-radius:14px;padding:16px;overflow:auto}
.modal-header{display:flex;gap:16px}
.modal-header img{width:140px;height:210px;object-fit:cover;border-radius:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.episodes{margin-top:10px;border-top:1px solid #ccc;padding-top:10px}
.ep{display:grid;grid-template-columns:80px 1fr auto;gap:6px;margin-top:6px}
.ep span{font-weight:700;text-align:center}
</style>
</head>

<body>

<script>
/* SUPABASE */
const supabaseClient = supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

/* BUNNY */
const BUNNY_STORAGE_ZONE="sessao99";
const BUNNY_API_KEY="d498d56e-361b-4a1e-9edb9eb63e3b-2e6a-4c17";
const BUNNY_STORAGE_HOST="https://br.storage.bunnycdn.com";
const BUNNY_CDN_URL="https://sessao99.b-cdn.net";

async function uploadCapa(file){
  if(!file) return "";
  const ext=file.name.split(".").pop();
  const name=`${Date.now()}_${crypto.randomUUID()}.${ext}`;
  const url=`${BUNNY_STORAGE_HOST}/${BUNNY_STORAGE_ZONE}/capas/${name}`;
  await fetch(url,{method:"PUT",headers:{AccessKey:BUNNY_API_KEY,"Content-Type":file.type},body:file});
  return `${BUNNY_CDN_URL}/capas/${name}`;
}

let registros=[], atual=null;

/* PARSER */
function limparTitulo(t){return t.replace(/download|torrent/ig,"").trim()}
function parseTexto(raw,f){
  if(!raw)return;
  const g=r=>(raw.match(r)||[])[1]||"";
  f.titulo.value=limparTitulo(raw.split("\n")[0]||"");
  f.descricao.value=g(/Sinopse:\s*([\s\S]+)/i);
  f.categoria.value=g(/G[eê]neros:\s*(.+)/i);
  f.classificacao.value=g(/Cl[aá]ss?ifica[cç][aã]o:\s*(.+)/i);
  f.ano.value=g(/Lan[cç]amento:\s*(\d{4})/i);
  f.idioma.value=g(/Idioma:\s*(.+)/i);
  f.audio.value=g(/Dublado|Dual Áudio/i);
  f.nota.value=g(/Nota da Cr[ií]tica:\s*([\d.]+)/i);
}

/* CRUD */
async function salvar(){
  let capa="";
  if(capaFile.files.length) capa=await uploadCapa(capaFile.files[0]);

  if(tipo.value==="serie"){
    await supabaseClient.from("filmes").insert({
      titulo,descricao,categoria,raw_info:rawInfo.value,
      tipo:"serie",serie_nome:titulo.value,capa_url:capa,ativo:true
    });

    const eps=[...episodiosCadastro.querySelectorAll("input")];
    if(eps.length){
      await supabaseClient.from("filmes").insert(
        eps.map((i,n)=>({
          titulo:`${titulo.value} E${n+1}`,
          tipo:"serie",serie_nome:titulo.value,
          temporada:1,episodio:n+1,video_url:i.value,ativo:true
        }))
      );
    }
  } else {
    await supabaseClient.from("filmes").insert({
      titulo:titulo.value,descricao:descricao.value,categoria:categoria.value,
      classificacao:classificacao.value,ano_lancamento:ano.value,
      idioma:idioma.value,audio:audio.value,nota_critica:nota.value,
      tipo:tipo.value,video_url:video.value,capa_url:capa,
      raw_info:rawInfo.value,ativo:true
    });
  }
  carregar();
}

async function carregar(){
  const {data}=await supabaseClient.from("filmes").select("*").order("created_at",{ascending:false});
  registros=data||[];
  render();
}

function render(){
  lista.innerHTML="";
  registros.forEach(r=>{
    if(r.tipo==="serie" && r.episodio!=null) return;
    const d=document.createElement("div");
    d.className="card";
    d.ondblclick=()=>abrirModal(r);
    d.innerHTML=`<img src="${r.capa_url||""}"><div class="box">${r.titulo}</div>`;
    lista.appendChild(d);
  });
}

async function abrirModal(r){
  atual=r;
  modal.style.display="flex";
  mCapa.src=r.capa_url||"";
  mTitulo.value=r.titulo||"";
  mDescricao.value=r.descricao||"";
  mCategoria.value=r.categoria||"";
  mVideo.value=r.video_url||"";
  epBox.innerHTML="";
  mSerieBox.style.display=r.tipo==="serie"?"block":"none";

  if(r.tipo==="serie"){
    const {data}=await supabaseClient.from("filmes")
      .select("*").eq("serie_nome",r.serie_nome)
      .not("episodio","is",null).order("episodio");
    data.forEach(ep=>{
      epBox.innerHTML+=`
        <div class="ep">
          <span>E${ep.episodio}</span>
          <input value="${ep.video_url}">
          <button onclick="excluirEp('${ep.id}')">❌</button>
        </div>`;
    });
  }
}

async function excluirEp(id){
  await supabaseClient.from("filmes").delete().eq("id",id);
  abrirModal(atual);
}

async function excluirRegistro(){
  if(!confirm("Excluir conteúdo?")) return;
  await supabaseClient.from("filmes").delete().eq("id",atual.id);
  modal.style.display="none";
  carregar();
}

document.addEventListener("DOMContentLoaded",carregar);
</script>

<!-- UI -->
<div class="wrapper">
  <div class="panel">
    <h3>Novo Conteúdo</h3>
    <textarea id="rawInfo"></textarea>
    <button onclick="parseTexto(rawInfo,{titulo,descricao,categoria,classificacao,ano,idioma,audio,nota})">Autofill</button>
    <input id="titulo" placeholder="Título">
    <textarea id="descricao" placeholder="Sinopse"></textarea>
    <input id="categoria" placeholder="Categoria">
    <input id="classificacao" placeholder="Classificação">
    <input id="ano" placeholder="Ano">
    <input id="idioma" placeholder="Idioma">
    <input id="audio" placeholder="Áudio">
    <input id="nota" placeholder="Nota">
    <select id="tipo" onchange="serieBox.style.display=this.value==='serie'?'block':'none'">
      <option value="filme">Filme</option>
      <option value="serie">Série</option>
      <option value="documentario">Documentário</option>
    </select>
    <input id="video" placeholder="ID do vídeo">
    <input type="file" id="capaFile">
    <div id="serieBox" style="display:none">
      <div id="episodiosCadastro"></div>
      <button type="button" onclick="addEpisodio()">+ Episódio</button>
    </div>
    <button onclick="salvar()">Salvar</button>
  </div>

  <div class="panel">
    <h3>Conteúdos</h3>
    <div id="lista" class="grid"></div>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modal-box">
    <div class="modal-header">
      <img id="mCapa">
      <input type="file" id="mCapaFile">
    </div>
    <input id="mTitulo">
    <textarea id="mDescricao"></textarea>
    <input id="mCategoria">
    <input id="mVideo">
    <div id="mSerieBox" class="episodes"><div id="epBox"></div></div>
    <button onclick="excluirRegistro()" class="danger">Excluir</button>
  </div>
</div>

<script>
function addEpisodio(){
  episodiosCadastro.innerHTML+=`
    <div class="ep">
      <span>E${episodiosCadastro.children.length+1}</span>
      <input>
      <button onclick="this.parentElement.remove()">❌</button>
    </div>`;
}
</script>

</body>
</html>

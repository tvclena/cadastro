<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CLENA TV • Painel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
:root{
  --bg:#05060c;
  --panel:#0f1424;
  --card:#151a30;
  --input:#0b1020;
  --accent:#dc2626;
  --danger:#7f1d1d;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --border:#1f2937;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,Arial;
}

.wrapper{
  height:100vh;
  padding:16px;
  display:grid;
  grid-template-columns:380px 1fr;
  gap:16px;
}

.panel{
  background:linear-gradient(180deg,#0f1424,#0b1020);
  border-radius:18px;
  padding:16px;
  display:flex;
  flex-direction:column;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}

h3,h4{margin:6px 0 10px}
label{font-size:12px;color:var(--muted);margin-top:10px}

input,textarea,select{
  width:100%;
  margin-top:6px;
  padding:11px 12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--input);
  color:#fff;
}

textarea{resize:vertical;min-height:70px}

button{
  margin-top:14px;
  padding:12px;
  border:none;
  border-radius:14px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
  font-weight:600;
}

button.secondary{background:#1f2937}
button.danger{background:var(--danger)}

.grid{
  flex:1;
  overflow:auto;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:14px;
}

.card{
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}
.card:hover{transform:translateY(-3px)}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card .box{
  padding:10px;
  font-size:13px;
}
.card .box b{display:block;margin-bottom:4px}

.badge{
  display:inline-block;
  font-size:11px;
  padding:3px 8px;
  border-radius:999px;
  background:#1f2937;
  color:var(--muted);
}

/* EPISÓDIOS */
.episodio{
  background:#0b1020;
  border-radius:12px;
  padding:8px;
  margin-top:8px;
  display:grid;
  grid-template-columns:42px 1fr auto;
  gap:6px;
  align-items:center;
}
.episodio span{
  text-align:center;
  font-weight:700;
  color:var(--muted);
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.modal-box{
  width:760px;
  max-height:90vh;
  background:var(--panel);
  border-radius:22px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.modal-header{
  display:flex;
  gap:16px;
  padding:16px;
  border-bottom:1px solid var(--border);
}

.modal-header img{
  width:90px;
  height:130px;
  object-fit:cover;
  border-radius:12px;
}

.modal-body{
  padding:16px;
  overflow:auto;
}

.readonly{
  opacity:.7;
  pointer-events:none;
}

.kv{
  font-size:13px;
  margin:4px 0;
}
.kv b{color:#fff}

.modal-actions{
  display:flex;
  gap:10px;
  padding:16px;
  border-top:1px solid var(--border);
}
</style>
</head>

<body>

<script>
/* ===== SUPABASE ===== */
const supabaseClient = supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

/* ===== BUNNY CDN ===== */
const BUNNY_STORAGE_ZONE="sessao99";
const BUNNY_API_KEY="d498d56e-361b-4a1e-9edb9eb63e3b-2e6a-4c17";
const BUNNY_STORAGE_HOST="https://br.storage.bunnycdn.com";
const BUNNY_CDN_URL="https://sessao99.b-cdn.net";

async function uploadCapa(file){
  if(!file) return "";
  const ext=file.name.split(".").pop();
  const name=`${Date.now()}_${crypto.randomUUID()}.${ext}`;
  const url=`${BUNNY_STORAGE_HOST}/${BUNNY_STORAGE_ZONE}/capas/${name}`;
  const res=await fetch(url,{
    method:"PUT",
    headers:{AccessKey:BUNNY_API_KEY,"Content-Type":file.type},
    body:file
  });
  if(!res.ok) throw new Error("Erro ao enviar capa");
  return `${BUNNY_CDN_URL}/capas/${name}`;
}

const lista = document.getElementById("lista");
let registros=[], atual=null, duracaoMin=null;

function limparTitulo(t){
  return t.replace(/download|torrent/ig,"").replace(/\s{2,}/g," ").trim();
}

function analisarTexto(){
  const raw=rawInfo.value;
  if(!raw.trim()) return alert("Cole o texto primeiro");

  const get=r=>{const m=raw.match(r);return m?m[1].trim():""};

  titulo.value=limparTitulo(raw.split("\n").find(l=>l.trim())||"");
  descricao.value=get(/Sinopse:\s*([\s\S]+)/i);
  categoria.value=get(/G[eê]neros:\s*(.+)/i);
  classificacao_indicativa.value=get(/Classifica[cç][aã]o:\s*(.+)/i);
  ano_lancamento.value=get(/Lan[cç]amento:\s*(\d{4})/i);
  idioma.value=get(/Idioma:\s*(.+)/i);
  audio.value=get(/(Dublado\s*\/\s*Dual Áudio|Dublado|Dual Áudio)/i);
  nota_critica.value=get(/Nota da Cr[ií]tica:\s*([\d.]+)/i);

  const d=get(/Dura[cç][aã]o:\s*(\d+)/i);
  duracaoMin=d?Number(d):null;

  alert("Texto analisado. Complete capa e IDs.");
}

function toggleTipo(){
  boxFilme.style.display=tipo.value==="filme"?"block":"none";
  boxSerie.style.display=tipo.value==="serie"?"block":"none";
  if(tipo.value==="serie"&&!epsNovo.children.length) addEpisodio();
}

function addEpisodio(){
  const n=epsNovo.children.length+1;
  const d=document.createElement("div");
  d.className="episodio";
  d.innerHTML=`
    <span>${n}</span>
    <input class="vid" placeholder="ID do vídeo">
    <button class="danger" onclick="this.parentNode.remove()">🗑</button>
  `;
  epsNovo.appendChild(d);
}

async function salvarNovo(){
  let capa="";
  if(capaFile.files.length) capa=await uploadCapa(capaFile.files[0]);

  const base={
    titulo:titulo.value,
    descricao:descricao.value,
    categoria:categoria.value,
    classificacao_indicativa:classificacao_indicativa.value,
    capa_url:capa,
    tipo:tipo.value,
    ano_lancamento:Number(ano_lancamento.value)||null,
    idioma:idioma.value,
    audio:audio.value,
    nota_critica:Number(nota_critica.value)||null,
    duracao_minutos:duracaoMin,
    raw_info:rawInfo.value,
    ativo:true
  };

  if(tipo.value==="filme"){
    await supabaseClient.from("filmes").insert({...base,video_url:videoFilme.value});
    return carregar();
  }

  const rows=[...epsNovo.children].map((e,i)=>({
    ...base,
    serie_nome:titulo.value,
    temporada:Number(temporadaNova.value),
    episodio:i+1,
    video_url:e.querySelector(".vid").value
  }));

  await supabaseClient.from("filmes").insert(rows);
  carregar();
}

async function carregar(){
  const { data } = await supabaseClient
    .from("filmes")
    .select("*")
    .order("created_at",{ascending:false});

  registros=data||[];
  lista.innerHTML="";

  registros.forEach(r=>{
    const d=document.createElement("div");
    d.className="card";
    d.ondblclick=()=>abrirModal(r);
    d.innerHTML=`
      <img src="${r.capa_url||''}">
      <div class="box">
        <b>${r.titulo}</b>
        <span class="badge">${r.tipo}</span>
      </div>
    `;
    lista.appendChild(d);
  });
}

/* ===== MODAL ===== */
function abrirModal(r){
  atual=r;
  modal.style.display="flex";

  mCapa.src=r.capa_url||"";
  mTitulo.value=r.titulo;
  mDescricao.value=r.descricao||"";
  mGenero.value=r.categoria||"";
  mClassificacao.value=r.classificacao_indicativa||"";
  mAno.textContent=r.ano_lancamento||"-";
  mIdioma.textContent=r.idioma||"-";
  mAudio.textContent=r.audio||"-";
  mNota.textContent=r.nota_critica||"-";
  mDuracao.textContent=r.duracao_minutos?`${r.duracao_minutos} min`:"-";
  mRaw.textContent=r.raw_info||"-";

  if(r.tipo==="filme"){
    mVideo.textContent=r.video_url||"-";
    mSerieBox.style.display="none";
  }else{
    mVideo.textContent="-";
    mSerieBox.style.display="block";
  }
}

function fecharModal(){modal.style.display="none"}

window.addEventListener("DOMContentLoaded",carregar);
</script>

<div class="wrapper">

<!-- CADASTRO -->
<div class="panel">
  <h3>Novo Conteúdo</h3>

  <textarea id="rawInfo" placeholder="Cole todas as informações"></textarea>
  <button onclick="analisarTexto()">Analisar texto</button>

  <input id="titulo" placeholder="Título">
  <textarea id="descricao" placeholder="Sinopse"></textarea>

  <input id="categoria" placeholder="Gêneros (Fantasia, Romance)">
  <input id="classificacao_indicativa" placeholder="Classificação (14 Anos)">
  <input id="ano_lancamento" placeholder="Ano">
  <input id="idioma" placeholder="Idioma">
  <input id="audio" placeholder="Áudio">
  <input id="nota_critica" placeholder="Nota da crítica">

  <label>Capa</label>
  <input type="file" id="capaFile" accept="image/*">

  <select id="tipo" onchange="toggleTipo()">
    <option value="filme">Filme</option>
    <option value="serie">Série</option>
  </select>

  <div id="boxFilme">
    <input id="videoFilme" placeholder="ID do vídeo">
  </div>

  <div id="boxSerie" style="display:none">
    <input type="number" id="temporadaNova" value="1" min="1">
    <div id="epsNovo"></div>
    <button onclick="addEpisodio()">➕ Episódio</button>
  </div>

  <button onclick="salvarNovo()">Salvar</button>
</div>

<!-- LISTA -->
<div class="panel">
  <div id="lista" class="grid"></div>
</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal" onclick="fecharModal()">
  <div class="modal-box" onclick="event.stopPropagation()">

    <div class="modal-header">
      <img id="mCapa">
      <div>
        <input id="mTitulo">
        <span class="badge">Visualização</span>
      </div>
    </div>

    <div class="modal-body">
      <textarea id="mDescricao"></textarea>

      <h4>Informações</h4>
      <div class="kv"><b>Gêneros:</b> <input id="mGenero"></div>
      <div class="kv"><b>Classificação:</b> <input id="mClassificacao"></div>
      <div class="kv"><b>Ano:</b> <span id="mAno"></span></div>
      <div class="kv"><b>Idioma:</b> <span id="mIdioma"></span></div>
      <div class="kv"><b>Áudio:</b> <span id="mAudio"></span></div>
      <div class="kv"><b>Nota:</b> <span id="mNota"></span></div>
      <div class="kv"><b>Duração:</b> <span id="mDuracao"></span></div>
      <div class="kv"><b>ID do vídeo:</b> <span id="mVideo"></span></div>

      <h4>Texto bruto</h4>
      <pre id="mRaw" style="white-space:pre-wrap;font-size:12px;color:var(--muted)"></pre>

      <div id="mSerieBox" style="display:none">
        <p class="muted">Episódios não editáveis nesta tela.</p>
      </div>
    </div>

    <div class="modal-actions">
      <button class="secondary" onclick="fecharModal()">Fechar</button>
    </div>

  </div>
</div>

</body>
</html>

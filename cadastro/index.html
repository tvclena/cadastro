<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CLENA TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
:root{
  --bg:#05070f;
  --panel:#0f1424;
  --card:#151a30;
  --input:#0b1020;
  --accent:#dc2626;
  --accent-dark:#991b1b;
  --danger:#7f1d1d;
  --text:#e5e7eb;
  --muted:#9ca3af;
}
*{box-sizing:border-box}
body{
  margin:0;height:100vh;overflow:hidden;
  background:linear-gradient(180deg,#05060c,#07090f);
  color:var(--text);font-family:Inter,Arial,sans-serif;
}
.wrapper{
  height:100vh;padding:16px 20px;
  display:grid;grid-template-columns:360px 1fr;gap:16px;
}
.panel{background:var(--panel);border-radius:16px;padding:16px;display:flex;flex-direction:column}
label{font-size:12px;margin-top:8px;font-weight:700;color:var(--accent)}
input,textarea,select{
  width:100%;margin-top:4px;padding:9px 10px;border-radius:8px;border:none;
  background:var(--input);color:#fff;font-size:13px;
}
textarea{resize:none;min-height:80px}
button{
  margin-top:12px;padding:12px;border:none;border-radius:10px;
  background:var(--accent);color:#fff;font-weight:700;cursor:pointer
}
button:hover{background:var(--accent-dark)}
.list{flex:1;overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
.card{background:var(--card);border-radius:10px;overflow:hidden;font-size:11px;cursor:pointer}
.card img{width:100%;height:110px;object-fit:cover}
.card .box{padding:6px}
.card small{color:var(--muted)}

.episodio-row{
  display:grid;grid-template-columns:70px 1fr auto;gap:8px;margin-top:8px
}
.episodio-row button{background:var(--danger);padding:6px 10px}

/* MODAL */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.85);
  backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:999
}
.modal-box{
  width:900px;height:90vh;background:var(--panel);
  border-radius:18px;display:grid;grid-template-columns:280px 1fr;overflow:hidden
}
.modal-left{background:#020617;padding:12px}
.modal-left img{width:100%;height:360px;object-fit:cover;border-radius:12px}
.modal-right{display:flex;flex-direction:column;height:100%}
.modal-header{padding:14px 18px;border-bottom:1px solid #1f2937;font-weight:700}
.modal-content{flex:1;padding:14px 18px;overflow-y:auto}
.modal-footer{
  padding:14px 18px;border-top:1px solid #1f2937;
  display:flex;gap:12px;justify-content:flex-end
}
.modal-footer button:last-child{background:#1f2937}

/* OVERLAY */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  display:none;align-items:center;justify-content:center;z-index:2000
}
.overlay-box{
  background:#020617;padding:26px 34px;border-radius:14px;
  display:flex;gap:12px;font-weight:700
}
.spinner{
  width:20px;height:20px;border:3px solid #333;
  border-top:3px solid var(--accent);border-radius:50%;
  animation:spin 1s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>

<!-- OVERLAY -->
<div id="overlay" class="overlay">
  <div class="overlay-box">
    <div class="spinner"></div>
    Salvando…
  </div>
</div>

<!-- BUNNY CONFIG -->
<script>
const BUNNY_STORAGE_ZONE="sessao99";
const BUNNY_API_KEY="d498d56e-361b-4a1e-9edb9eb63e3b-2e6a-4c17";
const BUNNY_CDN_URL="https://sessao99.b-cdn.net";

async function uploadBunny(file){
  const name=Date.now()+"_"+file.name.replace(/\s+/g,"_");
  const url=`https://br.storage.bunnycdn.com/${BUNNY_STORAGE_ZONE}/capas/${name}`;
  const res=await fetch(url,{
    method:"PUT",
    headers:{
      "AccessKey":BUNNY_API_KEY,
      "Content-Type":file.type
    },
    body:file
  });
  if(!res.ok) throw new Error("Erro upload Bunny");
  return `${BUNNY_CDN_URL}/capas/${name}`;
}
</script>

<script>
const supabaseClient=supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

let registros=[],atual=null;
function showOverlay(){overlay.style.display="flex"}
function hideOverlay(){overlay.style.display="none"}

async function carregar(){
  const {data}=await supabaseClient.from("filmes").select("*").order("created_at",{ascending:false});
  registros=data||[];
  status.textContent=`${registros.length} registros`;
  render();
}

function render(){
  lista.innerHTML="";
  registros.forEach(r=>{
    const d=document.createElement("div");
    d.className="card";
    d.ondblclick=()=>abrirModal(r);
    d.innerHTML=`
      <img src="${r.capa_url}">
      <div class="box">
        <b>${r.titulo}</b><br>
        <small>${r.categoria||""}${r.episodio?" • Ep "+r.episodio:""}</small>
      </div>`;
    lista.appendChild(d);
  });
}

/* MODAL */
function abrirModal(r){
  atual=r;
  modal.style.display="flex";
  mCapa.src=r.capa_url;
  mTitulo.value=r.titulo;
  mDescricao.value=r.descricao||"";
  epsEdit.innerHTML="";
}

mCapaFile.onchange=()=>{
  if(mCapaFile.files[0]){
    mCapa.src=URL.createObjectURL(mCapaFile.files[0]);
  }
};

async function salvarEdicao(){
  showOverlay();
  let capaUrl=atual.capa_url;
  if(mCapaFile.files.length){
    capaUrl=await uploadBunny(mCapaFile.files[0]);
  }
  await supabaseClient.from("filmes").update({
    titulo:mTitulo.value,
    descricao:mDescricao.value,
    capa_url:capaUrl
  }).eq("id",atual.id);
  hideOverlay();
  fecharModal();
  carregar();
}

function fecharModal(){modal.style.display="none";}
</script>

<!-- MODAL HTML -->
<div id="modal" class="modal">
  <div class="modal-box">
    <div class="modal-left">
      <img id="mCapa">
      <label>Selecionar nova capa</label>
      <input type="file" id="mCapaFile" accept="image/*">
    </div>
    <div class="modal-right">
      <div class="modal-header">Editar Cadastro</div>
      <div class="modal-content">
        <label>Título</label>
        <input id="mTitulo">
        <label>Descrição</label>
        <textarea id="mDescricao"></textarea>
      </div>
      <div class="modal-footer">
        <button onclick="salvarEdicao()">Salvar</button>
        <button onclick="fecharModal()">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<div class="wrapper">
  <div class="panel">
    <h3>Novo</h3>
    <label>Título</label><input id="titulo">
    <label>Descrição</label><textarea id="descricao"></textarea>
    <label>Categoria</label><input id="categoria">
    <label>URL da Capa</label><input id="capa">
    <label>ID do Vídeo</label><input id="videoFilmeNovo">
    <button onclick="salvarNovo()">Salvar</button>
  </div>
  <div class="panel">
    <div id="status">Carregando…</div>
    <div class="list"><div id="lista" class="grid"></div></div>
  </div>
</div>

<script>
async function salvarNovo(){
  showOverlay();
  await supabaseClient.from("filmes").insert({
    titulo:titulo.value,
    descricao:descricao.value,
    categoria:categoria.value,
    capa_url:capa.value,
    video_url:videoFilmeNovo.value,
    tipo:"filme",
    ativo:true
  });
  hideOverlay();
  carregar();
}
carregar();
</script>

</body>
</html>

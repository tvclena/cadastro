<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CLENA TV • Cadastro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
:root{
  --bg:#ffffff;
  --panel:#f5f5f5;
  --card:#ffffff;
  --border:#d1d5db;
  --text:#000000;
  --accent:#dc2626;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial;
}

.wrapper{
  height:100vh;
  padding:16px;
  display:grid;
  grid-template-columns:380px 1fr;
  gap:16px;
}

.panel{
  background:var(--panel);
  border-radius:14px;
  padding:16px;
  display:flex;
  flex-direction:column;
}

h3{margin:0 0 12px}

label{
  font-size:13px;
  font-weight:600;
  margin-top:10px;
}

input,textarea,select{
  width:100%;
  margin-top:4px;
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#fff;
  color:#000;
}

textarea{resize:vertical}

button{
  margin-top:14px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.grid{
  flex:1;
  overflow:auto;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:14px;
}

.card{
  background:var(--card);
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  cursor:pointer;
}
.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}
.card .box{
  padding:10px;
  font-size:14px;
  font-weight:600;
}
</style>
</head>

<body>

<script>
const supabaseClient = supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

function limparTitulo(txt){
  return txt.replace(/download/ig,"").replace(/torrent/ig,"").replace(/\s{2,}/g," ").trim();
}
</script>

<div class="wrapper">

<!-- CADASTRO -->
<div class="panel">
  <h3>Novo Conteúdo</h3>

  <label>Texto para análise</label>
  <textarea id="rawInfo"></textarea>
  <button onclick="analisarTexto()">Analisar texto</button>

  <label>Nome</label>
  <input id="titulo">

  <label>Sinopse</label>
  <textarea id="descricao"></textarea>

  <label>Categoria (gêneros)</label>
  <input id="categoria">

  <label>Classificação indicativa</label>
  <input id="classificacao">

  <label>Ano</label>
  <input id="ano">

  <label>Idioma</label>
  <input id="idioma">

  <label>Áudio</label>
  <input id="audio">

  <label>Nota da crítica</label>
  <input id="nota">

  <label>Capa</label>
  <input type="file" id="capaFile">

  <label>Tipo</label>
  <select id="tipo">
    <option value="filme">Filme</option>
    <option value="serie">Série</option>
  </select>

  <label>ID do vídeo</label>
  <input id="video">

  <button onclick="salvar()">Salvar</button>
</div>

<!-- LISTA -->
<div class="panel">
  <div id="lista" class="grid"></div>
</div>

</div>

<script>
function analisarTexto(){
  const raw=rawInfo.value;
  if(!raw.trim()) return;

  const get=r=>{const m=raw.match(r);return m?m[1]:""};

  titulo.value = limparTitulo(raw.split("\n").find(l=>l.trim())||"");
  descricao.value = get(/Sinopse:\s*([\s\S]+)/i);
  categoria.value = get(/G[eê]neros:\s*(.+)/i);
  classificacao.value = get(/Classifica[cç][aã]o:\s*(.+)/i);
  ano.value = get(/Lan[cç]amento:\s*(\d{4})/i);
  idioma.value = get(/Idioma:\s*(.+)/i);
  audio.value = get(/(Dublado\s*\/\s*Dual Áudio|Dublado|Dual Áudio)/i);
  nota.value = get(/Nota da Cr[ií]tica:\s*([\d.]+)/i);
}

async function salvar(){
  await supabaseClient.from("filmes").insert({
    titulo:titulo.value,
    descricao:descricao.value,
    categoria:categoria.value,
    classificacao_indicativa:classificacao.value,
    ano_lancamento:Number(ano.value)||null,
    idioma:idioma.value,
    audio:audio.value,
    nota_critica:Number(nota.value)||null,
    video_url:video.value,
    raw_info:rawInfo.value,
    ativo:true
  });
  carregar();
}

async function carregar(){
  const {data}=await supabaseClient.from("filmes").select("*").order("created_at",{ascending:false});
  lista.innerHTML="";
  (data||[]).forEach(r=>{
    const d=document.createElement("div");
    d.className="card";
    d.innerHTML=`<img src="${r.capa_url||''}"><div class="box">${r.titulo}</div>`;
    lista.appendChild(d);
  });
}

document.addEventListener("DOMContentLoaded",carregar);
</script>

</body>
</html>

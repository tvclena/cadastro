<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CLENA TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
:root{
  --bg:#05070f;
  --panel:#0f1424;
  --card:#151a30;
  --input:#0b1020;
  --accent:#dc2626;
  --accent-dark:#991b1b;
  --danger:#7f1d1d;
  --text:#e5e7eb;
  --muted:#9ca3af;
}
*{box-sizing:border-box}
body{
  margin:0;height:100vh;overflow:hidden;
  background:linear-gradient(180deg,#05060c,#07090f);
  color:var(--text);font-family:Inter,Arial,sans-serif;
}
.wrapper{
  height:100vh;padding:16px 20px;
  display:grid;grid-template-columns:360px 1fr;gap:16px;
}
.panel{background:var(--panel);border-radius:16px;padding:16px;display:flex;flex-direction:column}
label{font-size:12px;margin-top:8px;font-weight:700;color:var(--accent)}
input,textarea,select{
  width:100%;margin-top:4px;padding:9px 10px;border-radius:8px;border:none;
  background:var(--input);color:var(--accent);font-size:13px;font-weight:600;
}
input::placeholder,textarea::placeholder{color:#fff}
textarea{resize:none;min-height:80px}
button{
  margin-top:12px;padding:12px;border:none;border-radius:10px;
  background:var(--accent);color:#fff;cursor:pointer;font-weight:700
}
button:hover{background:var(--accent-dark)}
.list{flex:1;overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
.card{background:var(--card);border-radius:10px;overflow:hidden;font-size:11px;cursor:pointer}
.card img{width:100%;height:110px;object-fit:cover}
.card .box{padding:6px}
.card small{color:var(--muted)}

.episodio-row{
  display:grid;grid-template-columns:70px 1fr auto;gap:8px;margin-top:8px
}
.episodio-row button{background:var(--danger);padding:6px 10px}

.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.85);
  backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:999
}

/* ===== MODAL NOVO ===== */
.modal-box{
  width:900px;max-height:90vh;background:var(--panel);border-radius:20px;
  display:grid;grid-template-columns:300px 1fr;overflow:hidden
}
.modal-left{
  background:#020617;padding:12px;display:flex;flex-direction:column;gap:10px
}
.modal-left img{
  width:100%;height:360px;object-fit:cover;border-radius:14px
}
.modal-right{
  padding:18px;overflow-y:auto
}
.modal-actions{display:flex;gap:10px;margin-top:14px}
.modal-actions button:last-child{background:#1f2937}
.add-ep{background:#1f2937}
</style>
</head>

<body>

<!-- LISTA DE CATEGORIAS -->
<datalist id="categorias">
  <option>Romance</option><option>Suspense</option><option>Terror</option>
  <option>Ação</option><option>Aventura</option><option>Drama</option>
  <option>Comédia</option><option>Ficção Científica</option><option>Fantasia</option>
  <option>Documentário</option><option>Animação</option><option>Policial</option>
  <option>Thriller</option><option>Mistério</option><option>Guerra</option>
  <option>Musical</option><option>Biografia</option>
</datalist>

<div class="wrapper">

<!-- CADASTRO -->
<div class="panel">
  <h3>Novo</h3>

  <label>Título</label>
  <input id="titulo">

  <label>Descrição</label>
  <textarea id="descricao"></textarea>

  <label>Categoria</label>
  <input id="categoria" list="categorias">

  <label>URL da Capa</label>
  <input id="capa">

  <label>Tipo</label>
  <select id="tipo" onchange="toggleTipoNovo()">
    <option value="filme">Filme</option>
    <option value="serie">Série</option>
  </select>

  <div id="boxFilmeNovo">
    <label>ID do Vídeo (obrigatório)</label>
    <input id="videoFilmeNovo">
  </div>

  <div id="boxSerieNovo" style="display:none">
    <h4>Episódios</h4>
    <div id="epsNovo"></div>
    <button class="add-ep" onclick="addEpNovo()">➕ Adicionar episódio</button>
  </div>

  <button onclick="salvarNovo()">Salvar</button>
</div>

<!-- LISTA -->
<div class="panel">
  <div id="status">Carregando…</div>
  <div class="list"><div id="lista" class="grid"></div></div>
</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">

    <div class="modal-left">
      <img id="mCapa">
    </div>

    <div class="modal-right">

      <label>Título</label>
      <input id="mTitulo">

      <label>Descrição</label>
      <textarea id="mDescricao"></textarea>

      <label>Categoria</label>
      <input id="mCategoria" list="categorias">

      <div id="boxFilmeEdit" style="display:none">
        <label>ID do Vídeo (filme)</label>
        <input id="mVideoFilme">
      </div>

      <div id="boxSerieEdit" style="display:none">
        <h4>Episódios</h4>
        <div id="epsEdit"></div>
        <button class="add-ep" onclick="addEpEdit()">➕ Adicionar episódio</button>
      </div>

      <div class="modal-actions">
        <button onclick="salvarEdicao()">Salvar</button>
        <button onclick="fecharModal()">Cancelar</button>
      </div>

    </div>
  </div>
</div>

<script>
const supabaseClient=supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

let registros=[],atual=null;

/* LISTAGEM */
async function carregar(){
  const {data}=await supabaseClient.from("filmes").select("*").order("created_at",{ascending:false});
  registros=data||[];
  status.textContent=`${registros.length} registros`;
  render();
}
function render(){
  lista.innerHTML="";
  registros.forEach(r=>{
    const d=document.createElement("div");
    d.className="card";
    d.ondblclick=()=>abrirModal(r);
    d.innerHTML=`
      <img src="${r.capa_url}">
      <div class="box">
        <b>${r.titulo}</b><br>
        <small>${r.categoria||""}${r.episodio?" • Ep "+r.episodio:""}</small>
      </div>`;
    lista.appendChild(d);
  });
}

/* CADASTRO */
function toggleTipoNovo(){
  boxFilmeNovo.style.display=tipo.value==="filme"?"block":"none";
  boxSerieNovo.style.display=tipo.value==="serie"?"block":"none";
  if(tipo.value==="serie"&&!epsNovo.children.length) addEpNovo();
}
function addEpNovo(){
  const n=epsNovo.children.length+1;
  const div=document.createElement("div");
  div.className="episodio-row";
  div.innerHTML=`
    <input type="number" value="${n}">
    <input placeholder="ID do vídeo">
    <button onclick="this.parentNode.remove()">✖</button>`;
  epsNovo.appendChild(div);
}
async function salvarNovo(){
  if(tipo.value==="filme"){
    if(!videoFilmeNovo.value.trim()){alert("Informe o ID");return;}
    await supabaseClient.from("filmes").insert({
      titulo:titulo.value,descricao:descricao.value,categoria:categoria.value,
      capa_url:capa.value,video_url:videoFilmeNovo.value,tipo:"filme",ativo:true
    });
    carregar();return;
  }
  await supabaseClient.from("filmes").insert(
    [...epsNovo.children].map(e=>({
      titulo:titulo.value,descricao:descricao.value,categoria:categoria.value,
      capa_url:capa.value,video_url:e.children[1].value,
      tipo:"serie",serie_nome:titulo.value,episodio:e.children[0].value,ativo:true
    }))
  );
  carregar();
}

/* MODAL */
function abrirModal(r){
  atual=r;modal.style.display="flex";
  mCapa.src=r.capa_url;
  mTitulo.value=r.titulo;
  mDescricao.value=r.descricao||"";
  mCategoria.value=r.categoria||"";
  epsEdit.innerHTML="";
  if(r.tipo==="filme"){
    boxFilmeEdit.style.display="block";
    boxSerieEdit.style.display="none";
    mVideoFilme.value=r.video_url||"";
  }else{
    boxFilmeEdit.style.display="none";
    boxSerieEdit.style.display="block";
    registros.filter(e=>e.tipo==="serie"&&e.serie_nome===r.serie_nome)
      .sort((a,b)=>a.episodio-b.episodio)
      .forEach(e=>addEpEdit(e.episodio,e.video_url));
  }
}
function addEpEdit(ep="",vid=""){
  const div=document.createElement("div");
  div.className="episodio-row";
  div.innerHTML=`
    <input type="number" value="${ep}">
    <input value="${vid}">
    <button onclick="this.parentNode.remove()">✖</button>`;
  epsEdit.appendChild(div);
}
function fecharModal(){modal.style.display="none";atual=null;}

async function salvarEdicao(){
  if(atual.tipo==="filme"){
    if(!mVideoFilme.value.trim()){alert("ID obrigatório");return;}
    await supabaseClient.from("filmes").update({
      titulo:mTitulo.value,descricao:mDescricao.value,categoria:mCategoria.value,
      video_url:mVideoFilme.value
    }).eq("id",atual.id);
    fecharModal();carregar();return;
  }
  await supabaseClient.from("filmes").delete().eq("serie_nome",atual.serie_nome);
  await supabaseClient.from("filmes").insert(
    [...epsEdit.children].map(e=>({
      titulo:mTitulo.value,descricao:mDescricao.value,categoria:mCategoria.value,
      capa_url:atual.capa_url,video_url:e.children[1].value,
      tipo:"serie",serie_nome:mTitulo.value,episodio:e.children[0].value,ativo:true
    }))
  );
  fecharModal();carregar();
}

carregar();
</script>

</body>
</html>

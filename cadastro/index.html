<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CLENA TV • Painel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
:root{
  --panel:#0f1424;--card:#151a30;--input:#0b1020;
  --accent:#dc2626;--danger:#7f1d1d;--text:#e5e7eb;
}
*{box-sizing:border-box}
body{margin:0;background:#05060c;color:var(--text);font-family:Inter,Arial}
.wrapper{height:100vh;padding:16px;display:grid;grid-template-columns:360px 1fr;gap:16px}
.panel{background:var(--panel);border-radius:16px;padding:16px;display:flex;flex-direction:column}
input,textarea,select{
  width:100%;margin-top:6px;padding:10px;border-radius:10px;
  border:none;background:var(--input);color:#fff
}
button{margin-top:12px;padding:12px;border:none;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:180px;object-fit:cover}
.card .box{padding:8px;font-size:13px}
.episodio{
  background:#0b1020;border-radius:12px;padding:10px;margin-top:10px;
  display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;align-items:center
}
.episodio button{background:var(--danger);padding:8px}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:999}
.modal-box{width:650px;max-height:90vh;background:var(--panel);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.modal-cover img{width:100%;height:220px;object-fit:cover}
.modal-body{padding:16px;overflow:auto}
.modal-actions{display:flex;gap:10px;margin-top:14px}
.modal-actions .danger{background:var(--danger)}
.modal-actions .secondary{background:#1f2937}
</style>
</head>

<body>

<script>
/* ===== SUPABASE ===== */
const supabaseClient = supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

/* ===== BUNNY CDN (CAPAS) ===== */
const BUNNY_STORAGE_ZONE = "sessao99";
const BUNNY_API_KEY = "d498d56e-361b-4a1e-9edb9eb63e3b-2e6a-4c17";
const BUNNY_STORAGE_HOST = "https://br.storage.bunnycdn.com";
const BUNNY_CDN_URL = "https://sessao99.b-cdn.net";

async function uploadCapa(file){
  if(!file) return "";
  const ext=file.name.split(".").pop();
  const name=`${Date.now()}_${crypto.randomUUID()}.${ext}`;
  const url=`${BUNNY_STORAGE_HOST}/${BUNNY_STORAGE_ZONE}/capas/${name}`;

  const res=await fetch(url,{
    method:"PUT",
    headers:{AccessKey:BUNNY_API_KEY,"Content-Type":file.type},
    body:file
  });

  if(!res.ok) throw new Error("Erro ao enviar capa");
  return `${BUNNY_CDN_URL}/capas/${name}`;
}

let registros=[], atual=null;
</script>

<div class="wrapper">

<!-- CADASTRO -->
<div class="panel">
  <h3>Novo Conteúdo</h3>

  <input id="titulo" placeholder="Título">
  <textarea id="descricao" placeholder="Descrição"></textarea>
  <input id="categoria" placeholder="Categoria">

  <label>Capa</label>
  <input type="file" id="capaFile" accept="image/*">

  <select id="tipo" onchange="toggleTipo()">
    <option value="filme">Filme</option>
    <option value="serie">Série</option>
  </select>

  <div id="boxFilme">
    <input id="videoFilme" placeholder="ID do vídeo">
  </div>

  <div id="boxSerie" style="display:none">
    <h4>Episódios</h4>
    <div id="epsNovo"></div>
    <button onclick="addEpisodio()">➕ Episódio</button>
  </div>

  <button onclick="salvarNovo()">Salvar</button>
</div>

<!-- LISTA -->
<div class="panel">
  <div id="lista" class="grid"></div>
</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <div class="modal-cover"><img id="mCapa"></div>

    <div class="modal-body">
      <input id="mTitulo">
      <textarea id="mDescricao"></textarea>
      <input id="mCategoria">

      <label>Trocar capa</label>
      <input type="file" id="mCapaFile" accept="image/*">

      <div id="mFilme">
        <input id="mVideo" placeholder="ID do vídeo">
      </div>

      <div id="mSerie">
        <h4>Episódios</h4>
        <div id="epsEdit"></div>
        <button onclick="addEpisodio(true)">➕ Episódio</button>
      </div>

      <div class="modal-actions">
        <button onclick="salvarEdicao()">Salvar</button>
        <button class="danger" onclick="excluirAtual()">Excluir</button>
        <button class="secondary" onclick="fecharModal()">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<script>
async function carregar(){
  const {data}=await supabaseClient.from("filmes").select("*").order("created_at",{ascending:false});
  registros=data||[];
  render();
}

function render(){
  lista.innerHTML="";
  registros.forEach(r=>{
    const d=document.createElement("div");
    d.className="card";
    d.ondblclick=()=>abrirModal(r);
    d.innerHTML=`<img src="${r.capa_url||''}"><div class="box"><b>${r.titulo}</b><br>${r.tipo}</div>`;
    lista.appendChild(d);
  });
}

function toggleTipo(){
  boxFilme.style.display=tipo.value==="filme"?"block":"none";
  boxSerie.style.display=tipo.value==="serie"?"block":"none";
  if(tipo.value==="serie"&&!epsNovo.children.length) addEpisodio();
}

function addEpisodio(edit=false,ep=1,video=""){
  const wrap=edit?epsEdit:epsNovo;
  const d=document.createElement("div");
  d.className="episodio";
  d.innerHTML=`
    <input type="number" class="ep" value="${ep}">
    <input class="vid" placeholder="ID do vídeo" value="${video}">
    <button onclick="this.parentNode.remove()">🗑</button>
  `;
  wrap.appendChild(d);
}

async function salvarNovo(){
  let capa="";
  if(capaFile.files.length) capa=await uploadCapa(capaFile.files[0]);

  if(tipo.value==="filme"){
    await supabaseClient.from("filmes").insert({
      titulo:titulo.value,descricao:descricao.value,categoria:categoria.value,
      capa_url:capa,video_url:videoFilme.value,tipo:"filme",ativo:true
    });
    return carregar();
  }

  const rows=[...epsNovo.children].map(e=>({
    titulo:titulo.value,descricao:descricao.value,categoria:categoria.value,
    capa_url:capa,tipo:"serie",serie_nome:titulo.value,temporada:1,
    episodio:e.querySelector(".ep").value,
    video_url:e.querySelector(".vid").value,
    ativo:true
  }));
  await supabaseClient.from("filmes").insert(rows);
  carregar();
}

function abrirModal(r){
  atual=r;
  modal.style.display="flex";
  mCapa.src=r.capa_url||"";
  mTitulo.value=r.titulo;
  mDescricao.value=r.descricao||"";
  mCategoria.value=r.categoria||"";
  epsEdit.innerHTML="";

  if(r.tipo==="filme"){
    mFilme.style.display="block";mSerie.style.display="none";
    mVideo.value=r.video_url||"";
  }else{
    mFilme.style.display="none";mSerie.style.display="block";
    registros.filter(e=>e.serie_nome===r.serie_nome)
      .sort((a,b)=>a.episodio-b.episodio)
      .forEach(e=>addEpisodio(true,e.episodio,e.video_url));
  }
}

function fecharModal(){modal.style.display="none";}

async function salvarEdicao(){
  let capa=atual.capa_url;
  if(mCapaFile.files.length) capa=await uploadCapa(mCapaFile.files[0]);

  if(atual.tipo==="filme"){
    await supabaseClient.from("filmes").update({
      titulo:mTitulo.value,descricao:mDescricao.value,
      categoria:mCategoria.value,capa_url:capa,
      video_url:mVideo.value
    }).eq("id",atual.id);
    fecharModal();return carregar();
  }

  await supabaseClient.from("filmes").delete().eq("serie_nome",atual.serie_nome);

  const rows=[...epsEdit.children].map(e=>({
    titulo:mTitulo.value,descricao:mDescricao.value,categoria:mCategoria.value,
    capa_url:capa,tipo:"serie",serie_nome:mTitulo.value,temporada:1,
    episodio:e.querySelector(".ep").value,
    video_url:e.querySelector(".vid").value,
    ativo:true
  }));
  await supabaseClient.from("filmes").insert(rows);
  fecharModal();carregar();
}

async function excluirAtual(){
  if(!confirm("Tem certeza que deseja excluir?")) return;
  if(atual.tipo==="filme"){
    await supabaseClient.from("filmes").delete().eq("id",atual.id);
  }else{
    await supabaseClient.from("filmes").delete().eq("serie_nome",atual.serie_nome);
  }
  fecharModal();carregar();
}

carregar();
</script>

</body>
</html>

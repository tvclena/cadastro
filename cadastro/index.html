<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CLENA TV • Conteúdos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
:root{
  --bg:#ffffff;
  --panel:#f4f4f5;
  --card:#ffffff;
  --border:#d1d5db;
  --text:#000000;
  --accent:#dc2626;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial;
}

.wrapper{
  height:100vh;
  padding:16px;
  display:grid;
  grid-template-columns:400px 1fr;
  gap:16px;
}

.panel{
  background:var(--panel);
  border-radius:14px;
  padding:16px;
  display:flex;
  flex-direction:column;
}

h3{margin:0 0 10px}

label{
  font-size:13px;
  font-weight:600;
  margin-top:10px;
}

input,textarea,select{
  width:100%;
  margin-top:4px;
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#fff;
  color:#000;
}

textarea{resize:vertical}

button{
  margin-top:14px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.filters{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.grid{
  flex:1;
  overflow:auto;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:14px;
}

.card{
  background:var(--card);
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  cursor:pointer;
}
.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}
.card .box{
  padding:10px;
  font-size:14px;
  font-weight:600;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.modal-box{
  width:700px;
  max-height:90vh;
  background:#fff;
  border-radius:14px;
  padding:16px;
  overflow:auto;
}
</style>
</head>

<body>

<script>
const supabaseClient = supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

let registros=[], atual=null;

function limparTitulo(txt){
  return txt
    .replace(/download/ig,"")
    .replace(/torrent/ig,"")
    .replace(/\s{2,}/g," ")
    .trim();
}

function parseTexto(raw, target){
  const get=r=>{const m=raw.match(r);return m?m[1].trim():""};
  target.titulo.value = limparTitulo(raw.split("\n").find(l=>l.trim())||"");
  target.descricao.value = get(/Sinopse:\s*([\s\S]+)/i);
  target.categoria.value = get(/G[eê]neros:\s*(.+)/i);
  target.classificacao.value = get(/Classifica[cç][aã]o:\s*(.+)/i);
  target.ano.value = get(/Lan[cç]amento:\s*(\d{4})/i);
  target.idioma.value = get(/Idioma:\s*(.+)/i);
  target.audio.value = get(/(Dublado\s*\/\s*Dual Áudio|Dublado|Dual Áudio)/i);
  target.nota.value = get(/Nota da Cr[ií]tica:\s*([\d.]+)/i);
}
</script>

<div class="wrapper">

<!-- CADASTRO -->
<div class="panel">
<h3>Novo Conteúdo</h3>

<label>Texto para análise</label>
<textarea id="rawInfo"></textarea>
<button onclick="parseTexto(rawInfo,{
  titulo,descricao,categoria,classificacao,ano,idioma,audio,nota
})">Analisar texto</button>

<label>Nome</label><input id="titulo">
<label>Sinopse</label><textarea id="descricao"></textarea>
<label>Categoria</label><input id="categoria">
<label>Classificação</label><input id="classificacao">
<label>Ano</label><input id="ano">
<label>Idioma</label><input id="idioma">
<label>Áudio</label><input id="audio">
<label>Nota</label><input id="nota">

<label>Tipo</label>
<select id="tipo">
  <option value="filme">Filme</option>
  <option value="serie">Série</option>
</select>

<label>ID do vídeo</label>
<input id="video">

<button onclick="salvar()">Salvar</button>
</div>

<!-- LISTA -->
<div class="panel">

<div class="filters">
  <input id="busca" placeholder="Pesquisar..." oninput="render()">
  <select id="filtroTipo" onchange="render()">
    <option value="">Todos</option>
    <option value="filme">Filme</option>
    <option value="serie">Série</option>
  </select>
  <select id="filtroCategoria" onchange="render()">
    <option value="">Categorias</option>
  </select>
</div>

<div id="lista" class="grid"></div>
</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal" onclick="fecharModal()">
<div class="modal-box" onclick="event.stopPropagation()">

<label>Texto para análise</label>
<textarea id="mRaw"></textarea>
<button onclick="parseTexto(mRaw,{
  titulo:mTitulo,descricao:mDescricao,categoria:mCategoria,
  classificacao:mClassificacao,ano:mAno,idioma:mIdioma,audio:mAudio,nota:mNota
})">Analisar texto</button>

<label>Nome</label><input id="mTitulo">
<label>Sinopse</label><textarea id="mDescricao"></textarea>
<label>Categoria</label><input id="mCategoria">
<label>Classificação</label><input id="mClassificacao">
<label>Ano</label><input id="mAno">
<label>Idioma</label><input id="mIdioma">
<label>Áudio</label><input id="mAudio">
<label>Nota</label><input id="mNota">

<button onclick="salvarEdicao()">Salvar</button>
</div>
</div>

<script>
async function salvar(){
  await supabaseClient.from("filmes").insert({
    titulo:titulo.value,descricao:descricao.value,categoria:categoria.value,
    classificacao_indicativa:classificacao.value,
    ano_lancamento:ano.value,idioma:idioma.value,audio:audio.value,
    nota_critica:nota.value,tipo:tipo.value,video_url:video.value,
    raw_info:rawInfo.value,ativo:true
  });
  carregar();
}

async function carregar(){
  const {data}=await supabaseClient.from("filmes").select("*").order("created_at",{ascending:false});
  registros=data||[];
  popularCategorias();
  render();
}

function popularCategorias(){
  const set=new Set();
  registros.forEach(r=>{
    r.categoria?.split(",").forEach(c=>set.add(c.trim()));
  });
  filtroCategoria.innerHTML='<option value="">Categorias</option>';
  [...set].forEach(c=>{
    const o=document.createElement("option");
    o.value=c;o.textContent=c;
    filtroCategoria.appendChild(o);
  });
}

function render(){
  lista.innerHTML="";
  const t=busca.value.toLowerCase();
  registros.filter(r=>{
    if(filtroTipo.value && r.tipo!==filtroTipo.value) return false;
    if(filtroCategoria.value && !r.categoria?.includes(filtroCategoria.value)) return false;
    if(t && !r.titulo.toLowerCase().includes(t)) return false;
    return true;
  }).forEach(r=>{
    const d=document.createElement("div");
    d.className="card";
    d.ondblclick=()=>abrirModal(r);
    d.innerHTML=`<img src="${r.capa_url||''}"><div class="box">${r.titulo}</div>`;
    lista.appendChild(d);
  });
}

function abrirModal(r){
  atual=r;
  modal.style.display="flex";
  mTitulo.value=r.titulo;
  mDescricao.value=r.descricao||"";
  mCategoria.value=r.categoria||"";
  mClassificacao.value=r.classificacao_indicativa||"";
  mAno.value=r.ano_lancamento||"";
  mIdioma.value=r.idioma||"";
  mAudio.value=r.audio||"";
  mNota.value=r.nota_critica||"";
  mRaw.value=r.raw_info||"";
}

async function salvarEdicao(){
  await supabaseClient.from("filmes").update({
    titulo:mTitulo.value,descricao:mDescricao.value,categoria:mCategoria.value,
    classificacao_indicativa:mClassificacao.value,
    ano_lancamento:mAno.value,idioma:mIdioma.value,audio:mAudio.value,
    nota_critica:mNota.value,raw_info:mRaw.value
  }).eq("id",atual.id);
  fecharModal();carregar();
}

function fecharModal(){modal.style.display="none"}

document.addEventListener("DOMContentLoaded",carregar);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CLENA TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
:root{
  --bg:#05070f;
  --panel:#0f1424;
  --card:#151a30;
  --input:#0b1020;
  --accent:#dc2626;
  --accent-dark:#991b1b;
  --danger:#7f1d1d;
  --text:#e5e7eb;
  --muted:#9ca3af;
}
*{box-sizing:border-box}
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  background:linear-gradient(180deg,#05060c,#07090f);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}
.wrapper{
  height:100vh;
  padding:16px 20px;
  display:grid;
  grid-template-columns:360px 1fr;
  gap:16px;
}
.panel{
  background:var(--panel);
  border-radius:16px;
  padding:16px;
  display:flex;
  flex-direction:column;
}
label{font-size:12px;margin-top:8px;font-weight:600}
input,textarea,select{
  width:100%;
  margin-top:4px;
  padding:8px 10px;
  border-radius:8px;
  border:none;
  background:var(--input);
  color:#fff;
}
textarea{resize:none;min-height:80px}
button{
  margin-top:12px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
}
button:hover{background:var(--accent-dark)}
.list{flex:1;overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
.card{
  background:var(--card);
  border-radius:10px;
  overflow:hidden;
  font-size:11px;
  cursor:pointer;
}
.card img{width:100%;height:110px;object-fit:cover}
.card .box{padding:6px}
.card small{color:var(--muted)}

/* EPISÓDIOS */
.episodio-row{
  display:grid;
  grid-template-columns:70px 1fr auto;
  gap:8px;
  margin-top:8px;
}
.episodio-row button{
  background:var(--danger);
  padding:6px 10px;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(10px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.modal-box{
  width:560px;
  max-height:90vh;
  background:var(--panel);
  border-radius:18px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.modal-cover{height:220px}
.modal-cover img{width:100%;height:100%;object-fit:cover}
.modal-body{padding:16px;overflow-y:auto}
.modal-actions{display:flex;gap:10px;margin-top:14px}
.modal-actions button:last-child{background:#1f2937}
.add-ep{background:#1f2937}
</style>
</head>

<body>

<div class="wrapper">

<!-- CADASTRO -->
<div class="panel">
  <h3>Novo</h3>

  <label>Título</label>
  <input id="titulo">

  <label>Descrição</label>
  <textarea id="descricao"></textarea>

  <label>Categoria</label>
  <input id="categoria">

  <label>URL da Capa</label>
  <input id="capa">

  <label>Tipo</label>
  <select id="tipo" onchange="toggleTipo()">
    <option value="filme">Filme</option>
    <option value="serie">Série</option>
  </select>

  <!-- FILME -->
  <div id="boxFilme">
    <label>ID do Vídeo (obrigatório)</label>
    <input id="videoFilme">
  </div>

  <!-- SÉRIE -->
  <div id="boxSerie" style="display:none">
    <h4>Episódios</h4>
    <div id="epsNovo"></div>
    <button class="add-ep" onclick="addEpNovo()">➕ Adicionar episódio</button>
  </div>

  <button onclick="salvarNovo()">Salvar</button>
</div>

<!-- LISTA -->
<div class="panel">
  <div id="status">Carregando…</div>
  <div class="list">
    <div id="lista" class="grid"></div>
  </div>
</div>

</div>

<!-- MODAL EDIÇÃO -->
<div id="modal" class="modal">
  <div class="modal-box">
    <div class="modal-cover"><img id="mCapa"></div>
    <div class="modal-body">
      <label>Título</label>
      <input id="mTitulo">

      <label>Descrição</label>
      <textarea id="mDescricao"></textarea>

      <label>Categoria</label>
      <input id="mCategoria">

      <div id="serieEdit" style="display:none">
        <h4>Episódios</h4>
        <div id="epsEdit"></div>
        <button class="add-ep" onclick="addEpEdit()">➕ Adicionar episódio</button>
      </div>

      <div class="modal-actions">
        <button onclick="salvarEdicao()">Salvar</button>
        <button onclick="fecharModal()">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<script>
const supabaseClient = supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

let registros=[], atual=null;

function toggleTipo(){
  boxFilme.style.display = tipo.value==="filme" ? "block":"none";
  boxSerie.style.display = tipo.value==="serie" ? "block":"none";
  if(tipo.value==="serie" && epsNovo.children.length===0){
    addEpNovo();
  }
}

async function carregar(){
  const {data}=await supabaseClient.from("filmes").select("*").order("created_at",{ascending:false});
  registros=data||[];
  status.textContent=`${registros.length} registros`;
  render();
}

function render(){
  lista.innerHTML="";
  registros.forEach(r=>{
    const d=document.createElement("div");
    d.className="card";
    d.ondblclick=()=>abrirModal(r);
    d.innerHTML=`
      <img src="${r.capa_url}">
      <div class="box">
        <b>${r.titulo}</b><br>
        <small>${r.tipo}${r.episodio?" • Ep "+r.episodio:""}</small>
      </div>`;
    lista.appendChild(d);
  });
}

/* -------- NOVO -------- */
function addEpNovo(){
  const n=epsNovo.children.length+1;
  const div=document.createElement("div");
  div.className="episodio-row";
  div.innerHTML=`
    <input type="number" value="${n}">
    <input placeholder="ID do vídeo">
    <button onclick="this.parentNode.remove()">✖</button>`;
  epsNovo.appendChild(div);
}

async function salvarNovo(){
  if(tipo.value==="filme"){
    if(!videoFilme.value.trim()){
      alert("Informe o ID do vídeo do FILME");
      return;
    }
    await supabaseClient.from("filmes").insert({
      titulo:titulo.value,
      descricao:descricao.value,
      categoria:categoria.value,
      capa_url:capa.value,
      video_url:videoFilme.value,
      tipo:"filme",
      ativo:true
    });
    carregar();return;
  }

  const eps=[...epsNovo.children];
  if(eps.length===0){
    alert("Adicione pelo menos um episódio");
    return;
  }

  for(const e of eps){
    if(!e.children[1].value.trim()){
      alert("Todos os episódios precisam de ID de vídeo");
      return;
    }
  }

  const inserts=eps.map(e=>({
    titulo:titulo.value,
    descricao:descricao.value,
    categoria:categoria.value,
    capa_url:capa.value,
    video_url:e.children[1].value,
    tipo:"serie",
    serie_nome:titulo.value,
    episodio:e.children[0].value,
    ativo:true
  }));

  await supabaseClient.from("filmes").insert(inserts);
  carregar();
}

/* -------- MODAL -------- */
function abrirModal(r){
  atual=r;
  modal.style.display="flex";
  mCapa.src=r.capa_url;
  mTitulo.value=r.titulo;
  mDescricao.value=r.descricao||"";
  mCategoria.value=r.categoria||"";
  epsEdit.innerHTML="";
  if(r.tipo==="serie"){
    serieEdit.style.display="block";
    registros.filter(e=>e.tipo==="serie"&&e.serie_nome===r.serie_nome)
      .sort((a,b)=>a.episodio-b.episodio)
      .forEach(e=>addEpEdit(e.episodio,e.video_url));
  }else{
    serieEdit.style.display="none";
  }
}

function addEpEdit(ep="",vid=""){
  const n=epsEdit.children.length+1;
  const div=document.createElement("div");
  div.className="episodio-row";
  div.innerHTML=`
    <input type="number" value="${ep||n}">
    <input value="${vid||""}">
    <button onclick="this.parentNode.remove()">✖</button>`;
  epsEdit.appendChild(div);
}

function fecharModal(){
  modal.style.display="none";
  atual=null;
}

async function salvarEdicao(){
  await supabaseClient.from("filmes").delete().eq("serie_nome",atual.serie_nome||atual.titulo);

  const inserts=[...epsEdit.children].map(e=>({
    titulo:mTitulo.value,
    descricao:mDescricao.value,
    categoria:mCategoria.value,
    capa_url:atual.capa_url,
    video_url:e.children[1].value,
    tipo:"serie",
    serie_nome:mTitulo.value,
    episodio:e.children[0].value,
    ativo:true
  }));

  await supabaseClient.from("filmes").insert(inserts);
  fecharModal();
  carregar();
}

carregar();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CLENA TV • Conteúdos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
:root{
  --bg:#ffffff;
  --panel:#f3f4f6;
  --card:#ffffff;
  --border:#d1d5db;
  --text:#000000;
  --accent:#dc2626;
  --muted:#6b7280;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial}
.wrapper{height:100vh;padding:16px;display:grid;grid-template-columns:420px 1fr;gap:16px}
.panel{background:var(--panel);border-radius:14px;padding:16px;display:flex;flex-direction:column}
h3{margin:0 0 10px}
label{font-size:13px;font-weight:600;margin-top:10px}
input,textarea,select{
  width:100%;margin-top:4px;padding:10px;border-radius:8px;
  border:1px solid var(--border);background:#fff;color:#000
}
textarea{resize:vertical}
button{
  margin-top:14px;padding:12px;border:none;border-radius:10px;
  background:var(--accent);color:#fff;font-weight:700;cursor:pointer
}
.secondary{background:#6b7280}
.danger{background:#991b1b}
.filters{display:flex;gap:8px;margin-bottom:12px}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:var(--card);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:pointer}
.card img{width:100%;height:200px;object-fit:cover}
.card .box{padding:10px;font-size:14px;font-weight:600}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:999}
.modal-box{width:920px;max-height:90vh;background:#fff;border-radius:14px;padding:16px;overflow:auto}
.modal-header{display:flex;gap:16px}
.modal-header img{width:140px;height:210px;object-fit:cover;border-radius:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.episodes{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.ep{display:grid;grid-template-columns:80px 1fr auto;gap:6px;margin-top:6px}
.ep span{font-weight:700;text-align:center}
</style>
</head>

<body>

<script>
/* SUPABASE */
const supabaseClient = supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

/* BUNNY */
const BUNNY_STORAGE_ZONE="sessao99";
const BUNNY_API_KEY="d498d56e-361b-4a1e-9edb9eb63e3b-2e6a-4c17";
const BUNNY_STORAGE_HOST="https://br.storage.bunnycdn.com";
const BUNNY_CDN_URL="https://sessao99.b-cdn.net";

async function uploadCapa(file){
  if(!file) return "";
  const ext=file.name.split(".").pop();
  const name=`${Date.now()}_${crypto.randomUUID()}.${ext}`;
  const url=`${BUNNY_STORAGE_HOST}/${BUNNY_STORAGE_ZONE}/capas/${name}`;
  await fetch(url,{
    method:"PUT",
    headers:{AccessKey:BUNNY_API_KEY,"Content-Type":file.type},
    body:file
  });
  return `${BUNNY_CDN_URL}/capas/${name}`;
}

let registros=[], atual=null;

/* ===== UTIL ===== */
function limparTitulo(t){
  return t.replace(/download|torrent/ig,"").replace(/\s{2,}/g," ").trim();
}

function parseTexto(raw,f){
  if(!raw||!raw.trim())return;
  const g=r=>{const m=raw.match(r);return m?m[1].trim():""};
  const first=raw.split("\n").find(l=>l.trim());
  if(first) f.titulo.value = limparTitulo(first);

  f.descricao.value = g(/Sinopse:\s*([\s\S]+)/i);
  f.categoria.value = g(/G[eê]neros:\s*(.+)/i);

  f.classificacao.value =
    g(/Cl[aá]ss?ifica[cç][aã]o:\s*([\d]{1,2}\s*Anos?)/i) ||
    (g(/Cl[aá]ss?ifica[cç][aã]o:\s*(\d{1,2})/i)
      ? g(/Cl[aá]ss?ifica[cç][aã]o:\s*(\d{1,2})/i)+" Anos" : "");

  f.ano.value    = g(/Lan[cç]amento:\s*(\d{4})/i);
  f.idioma.value = g(/Idioma:\s*(.+)/i);
  f.audio.value  = g(/(Dublado\s*\/\s*Dual Áudio|Dual Áudio|Dublado)/i);
  f.nota.value   = g(/Nota da Cr[ií]tica:\s*([\d.]+)/i);
}
</script>

<div class="wrapper">

<!-- CADASTRO -->
<div class="panel">
<h3>Novo Conteúdo</h3>

<label>Texto para análise</label>
<textarea id="rawInfo"></textarea>
<button onclick="parseTexto(rawInfo.value,{titulo,descricao,categoria,classificacao,ano,idioma,audio,nota})">Analisar texto</button>

<label>Nome</label><input id="titulo">
<label>Sinopse</label><textarea id="descricao"></textarea>
<label>Categoria</label><input id="categoria">
<label>Classificação</label><input id="classificacao">
<label>Ano</label><input id="ano">
<label>Idioma</label><input id="idioma">
<label>Áudio</label><input id="audio">
<label>Nota</label><input id="nota">

<label>Tipo</label>
<select id="tipo">
  <option value="filme">Filme</option>
  <option value="serie">Série</option>
</select>

<label>ID do vídeo (Filme)</label>
<input id="video">

<label>Capa</label>
<input type="file" id="capaFile">

<button onclick="salvar()">Salvar</button>
</div>

<!-- LISTA -->
<div class="panel">
<div class="filters">
<input id="busca" placeholder="Pesquisar..." oninput="render()">
<select id="filtroTipo" onchange="render()">
<option value="">Todos</option>
<option value="filme">Filme</option>
<option value="serie">Série</option>
</select>
<select id="filtroCategoria" onchange="render()">
<option value="">Categorias</option>
</select>
</div>
<div id="lista" class="grid"></div>
</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal" onclick="fecharModal()">
<div class="modal-box" onclick="event.stopPropagation()">

<div class="modal-header">
<img id="mCapa">
<div style="flex:1">
<label>Nova capa (opcional)</label>
<input type="file" id="mCapaFile">
<label>Texto para análise</label>
<textarea id="mRaw"></textarea>
<button onclick="parseTexto(mRaw.value,{titulo:mTitulo,descricao:mDescricao,categoria:mCategoria,classificacao:mClassificacao,ano:mAno,idioma:mIdioma,audio:mAudio,nota:mNota})">Analisar texto</button>
</div>
</div>

<label>Nome</label><input id="mTitulo">
<label>Sinopse</label><textarea id="mDescricao"></textarea>

<div class="row">
<div>
<label>Categoria</label><input id="mCategoria">
<label>Classificação</label><input id="mClassificacao">
<label>Ano</label><input id="mAno">
<label>ID do vídeo (Filme)</label><input id="mVideo">
</div>
<div>
<label>Idioma</label><input id="mIdioma">
<label>Áudio</label><input id="mAudio">
<label>Nota</label><input id="mNota">
</div>
</div>

<div id="mSerieBox" class="episodes" style="display:none">
<h4>Episódios</h4>
<div id="epBox"></div>
<button onclick="addEpModal()">➕ Novo episódio</button>
</div>

<div style="display:flex;gap:10px;margin-top:16px">
<button onclick="salvarEdicao()">Salvar</button>
<button class="secondary" onclick="fecharModal()">Cancelar</button>
<button class="danger" onclick="excluirRegistro()">Excluir</button>
</div>

</div>
</div>

<script>
async function salvar(){
  let capa="";
  if(capaFile.files.length) capa=await uploadCapa(capaFile.files[0]);

  await supabaseClient.from("filmes").insert({
    titulo:titulo.value,
    descricao:descricao.value,
    categoria:categoria.value,
    classificacao_indicativa:classificacao.value,
    ano_lancamento:ano.value,
    idioma:idioma.value,
    audio:audio.value,
    nota_critica:nota.value,
    tipo:tipo.value,
    video_url:video.value,
    capa_url:capa,
    raw_info:rawInfo.value,
    ativo:true
  });
  carregar();
}

async function carregar(){
  const {data}=await supabaseClient.from("filmes").select("*").order("created_at",{ascending:false});
  registros=data||[];
  popularCategorias();
  render();
}

function popularCategorias(){
  const s=new Set();
  registros.forEach(r=>r.categoria?.split(",").forEach(c=>s.add(c.trim())));
  filtroCategoria.innerHTML='<option value="">Categorias</option>';
  [...s].forEach(c=>{
    const o=document.createElement("option");
    o.value=c;o.textContent=c;
    filtroCategoria.appendChild(o);
  });
}

function render(){
  lista.innerHTML="";
  const q=busca.value.toLowerCase();
  registros.filter(r=>{
    if(filtroTipo.value && r.tipo!==filtroTipo.value) return false;
    if(filtroCategoria.value && !r.categoria?.includes(filtroCategoria.value)) return false;
    if(q && !r.titulo.toLowerCase().includes(q)) return false;
    return true;
  }).forEach(r=>{
    const d=document.createElement("div");
    d.className="card";
    d.ondblclick=()=>abrirModal(r);
    d.innerHTML=`<img src="${r.capa_url||''}"><div class="box">${r.titulo}</div>`;
    lista.appendChild(d);
  });
}

function abrirModal(r){
  atual=r;
  modal.style.display="flex";

  mCapa.src=r.capa_url||"";
  mTitulo.value=r.titulo||"";
  mDescricao.value=r.descricao||"";
  mCategoria.value=r.categoria||"";
  mClassificacao.value=r.classificacao_indicativa||"";
  mAno.value=r.ano_lancamento||"";
  mIdioma.value=r.idioma||"";
  mAudio.value=r.audio||"";
  mNota.value=r.nota_critica||"";
  mVideo.value=r.video_url||"";
  mRaw.value=r.raw_info||"";

  epBox.innerHTML="";
  mSerieBox.style.display = r.tipo==="serie" ? "block" : "none";

  if(r.tipo==="serie"){
    registros
      .filter(e=>e.serie_nome===r.serie_nome)
      .sort((a,b)=>a.episodio-b.episodio)
      .forEach(e=>{
        const div=document.createElement("div");
        div.className="ep";
        div.innerHTML=`
          <span>E${e.episodio}</span>
          <input class="epVideo" value="${e.video_url||""}">
          <button onclick="this.parentNode.remove()">🗑</button>
        `;
        epBox.appendChild(div);
      });
  }
}

function addEpModal(){
  const num = epBox.children.length + 1;
  const div=document.createElement("div");
  div.className="ep";
  div.innerHTML=`
    <span>E${num}</span>
    <input class="epVideo" placeholder="ID do vídeo">
    <button onclick="this.parentNode.remove()">🗑</button>
  `;
  epBox.appendChild(div);
}

async function salvarEdicao(){
  let capa=atual.capa_url;
  if(mCapaFile.files.length) capa=await uploadCapa(mCapaFile.files[0]);

  await supabaseClient.from("filmes").update({
    titulo:mTitulo.value,
    descricao:mDescricao.value,
    categoria:mCategoria.value,
    classificacao_indicativa:mClassificacao.value,
    ano_lancamento:mAno.value,
    idioma:mIdioma.value,
    audio:mAudio.value,
    nota_critica:mNota.value,
    video_url:mVideo.value,
    capa_url:capa,
    raw_info:mRaw.value
  }).eq("id",atual.id);

  fecharModal();
  carregar();
}

async function excluirRegistro(){
  if(!confirm("Tem certeza que deseja excluir este conteúdo?")) return;

  if(atual.tipo === "serie"){
    await supabaseClient
      .from("filmes")
      .delete()
      .eq("serie_nome", atual.serie_nome || atual.titulo);
  }else{
    await supabaseClient
      .from("filmes")
      .delete()
      .eq("id", atual.id);
  }

  fecharModal();
  carregar();
}

function fecharModal(){
  modal.style.display="none";
}

document.addEventListener("DOMContentLoaded",carregar);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CLENA TV • Conteúdos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
:root{
  --bg:#ffffff;--panel:#f3f4f6;--card:#ffffff;
  --border:#d1d5db;--text:#000;--accent:#dc2626;--muted:#6b7280;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,Arial}
.wrapper{height:100vh;padding:16px;display:grid;grid-template-columns:420px 1fr;gap:16px}
.panel{background:var(--panel);border-radius:14px;padding:16px;display:flex;flex-direction:column}
h3{margin:0 0 10px}
label{font-size:13px;font-weight:600;margin-top:10px}
input,textarea,select{width:100%;margin-top:4px;padding:10px;border-radius:8px;border:1px solid var(--border)}
textarea{resize:vertical}
button{margin-top:14px;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
.secondary{background:#6b7280}
.danger{background:#991b1b}
.filters{display:flex;gap:8px;margin-bottom:12px}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:pointer}
.card img{width:100%;height:200px;object-fit:cover}
.card .box{padding:10px;font-weight:600}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
.modal-box{width:920px;max-height:90vh;background:#fff;border-radius:14px;padding:16px;overflow:auto}
.modal-header{display:flex;gap:16px}
.modal-header img{width:140px;height:210px;object-fit:cover;border-radius:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.episodes{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.ep{display:grid;grid-template-columns:80px 1fr auto;gap:6px;margin-top:6px}
.ep span{font-weight:700;text-align:center}
</style>
</head>

<body>

<script>
const supabaseClient = supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

let registros=[], atual=null;

/* ===== LOAD ===== */
async function carregar(){
  const {data}=await supabaseClient.from("filmes").select("*").order("created_at",{ascending:false});
  registros=data||[];
  render();
}
document.addEventListener("DOMContentLoaded",carregar);

/* ===== RENDER ===== */
function render(){
  lista.innerHTML="";
  const vistos=new Set();
  registros.forEach(r=>{
    if(r.tipo==="serie" && r.episodio) return;
    const chave=r.tipo==="serie"?r.serie_nome:r.id;
    if(vistos.has(chave)) return;
    vistos.add(chave);
    const d=document.createElement("div");
    d.className="card";
    d.ondblclick=()=>abrirModal(r);
    d.innerHTML=`<img src="${r.capa_url||''}"><div class="box">${r.titulo}</div>`;
    lista.appendChild(d);
  });
}

/* ===== CADASTRO ===== */
async function salvar(){
  if(tipo.value==="filme"){
    await supabaseClient.from("filmes").insert({
      titulo:titulo.value,descricao:descricao.value,categoria:categoria.value,
      classificacao_indicativa:classificacao.value,ano_lancamento:ano.value,
      idioma:idioma.value,audio:audio.value,nota_critica:nota.value,
      tipo:"filme",video_url:video.value,ativo:true
    });
  }

  if(tipo.value==="serie"){
    await supabaseClient.from("filmes").insert({
      titulo:titulo.value,tipo:"serie",serie_nome:titulo.value,ativo:true
    });

    const eps=[...document.querySelectorAll("#episodiosCadastro input")];
    const dados=eps.map((i,idx)=>({
      titulo:`${titulo.value} T${temporada.value}E${idx+1}`,
      tipo:"serie",serie_nome:titulo.value,
      temporada:Number(temporada.value),episodio:idx+1,
      video_url:i.value,ativo:true
    }));
    if(dados.length) await supabaseClient.from("filmes").insert(dados);
  }
  carregar();
}

/* ===== TIPO ===== */
tipo.onchange=()=>{
  const s=tipo.value==="serie";
  video.style.display=s?"none":"block";
  serieBox.style.display=s?"block":"none";
};

/* ===== EPISÓDIOS ===== */
function addEpisodio(valor=""){
  const n=episodiosCadastro.children.length+1;
  const d=document.createElement("div");
  d.className="ep";
  d.innerHTML=`<span>E${n}</span><input value="${valor}"><button onclick="this.parentElement.remove()">❌</button>`;
  episodiosCadastro.appendChild(d);
}

/* ===== MODAL ===== */
async function abrirModal(r){
  atual=r;
  modal.style.display="flex";
  mTitulo.value=r.titulo||"";mDescricao.value=r.descricao||"";
  mCategoria.value=r.categoria||"";mAno.value=r.ano_lancamento||"";
  mVideo.value=r.video_url||"";
  epBox.innerHTML="";
  mSerieBox.style.display=r.tipo==="serie"?"block":"none";

  if(r.tipo==="serie"){
    const {data}=await supabaseClient.from("filmes")
      .select("*").eq("serie_nome",r.serie_nome)
      .not("episodio","is",null).order("temporada").order("episodio");

    data.forEach(ep=>{
      const d=document.createElement("div");
      d.className="ep";
      d.innerHTML=`<span>T${ep.temporada}E${ep.episodio}</span>
      <input value="${ep.video_url}">
      <button onclick="excluirEp('${ep.id}')">❌</button>`;
      epBox.appendChild(d);
    });
  }
}
async function excluirEp(id){
  await supabaseClient.from("filmes").delete().eq("id",id);
  abrirModal(atual);
}
async function excluirRegistro(){
  if(confirm("Excluir conteúdo?")){
    await supabaseClient.from("filmes").delete().eq("id",atual.id);
    modal.style.display="none";carregar();
  }
}
</script>

<div class="wrapper">

<div class="panel">
<h3>Novo Conteúdo</h3>
<label>Nome</label><input id="titulo">
<label>Sinopse</label><textarea id="descricao"></textarea>
<label>Categoria</label><input id="categoria">
<label>Ano</label><input id="ano">
<label>Idioma</label><input id="idioma">
<label>Áudio</label><input id="audio">
<label>Nota</label><input id="nota">

<label>Tipo</label>
<select id="tipo">
<option value="filme">Filme</option>
<option value="serie">Série</option>
</select>

<input id="video" placeholder="ID do vídeo (Filme)">

<div id="serieBox" style="display:none">
<label>Temporada</label>
<select id="temporada"><option value="1">Temporada 1</option></select>
<h4>Episódios</h4>
<div id="episodiosCadastro"></div>
<button type="button" onclick="addEpisodio()">+ Adicionar episódio</button>
</div>

<button onclick="salvar()">Salvar</button>
</div>

<div class="panel">
<div id="lista" class="grid"></div>
</div>

</div>

<div id="modal" class="modal">
<div class="modal-box">
<label>Nome</label><input id="mTitulo">
<label>Sinopse</label><textarea id="mDescricao"></textarea>
<label>Categoria</label><input id="mCategoria">
<label>Ano</label><input id="mAno">
<label>ID do vídeo</label><input id="mVideo">
<div id="mSerieBox" class="episodes"><h4>Episódios</h4><div id="epBox"></div></div>
<button class="danger" onclick="excluirRegistro()">Excluir</button>
<button class="secondary" onclick="modal.style.display='none'">Fechar</button>
</div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel • Streaming ADMIN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#0f0f10;
  --card:#1c1c1e;
  --accent:#e50914;
  --green:#00c853;
  --yellow:#ff9800;
  --text:#fff;
  --muted:#aaa;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}

/* HEADER */
header{padding:22px 32px;font-size:22px;font-weight:800}

/* SECTION */
.section-title{padding:20px 32px 0;font-size:18px;font-weight:700}

/* KPIS */
.kpis{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  padding:0 32px 20px;
}
.kpi{background:var(--card);border-radius:14px;padding:16px}
.kpi span{font-size:12px;color:var(--muted)}
.kpi strong{display:block;font-size:26px;margin-top:6px}

/* GRID */
.grid{
  padding:20px 32px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:20px;
}
.card{
  position:relative;
  background:var(--card);
  border-radius:14px;
  overflow:hidden;
}
.card img{width:100%;height:260px;object-fit:cover}
.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,.2));
}
.info{
  position:absolute;
  bottom:0;
  padding:14px;
  width:100%;
}
.title{font-size:14px;font-weight:600}

/* FILME ACTION */
.actions{
  position:absolute;
  top:10px;
  right:10px;
}
.actions button{
  background:#000;
  border:none;
  color:#fff;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}

/* TABLE */
.table-container{padding:20px 32px 60px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px}
th,td{padding:14px;border-bottom:1px solid #2a2a2a;font-size:13px;white-space:nowrap}
th{background:#161616;color:#ccc}
.user-cell{display:flex;align-items:center;gap:10px}
.user-cell img{width:36px;height:36px;border-radius:50%;object-fit:cover}

/* STATUS */
.status{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600}
.aprovado{background:var(--green)}
.bloqueado{background:var(--accent)}

/* BUTTON */
button{cursor:pointer}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.modal-content{
  background:var(--card);
  padding:20px;
  border-radius:14px;
  width:420px;
}
.modal-content h3{margin-bottom:10px}
.modal-content input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  background:#111;
  border:none;
  color:#fff;
  border-radius:8px;
}
.modal-content button{
  width:100%;
  padding:10px;
  background:var(--green);
  border:none;
  border-radius:8px;
  font-weight:700;
}
.modal-close{
  background:#333;
  margin-top:6px;
}
.empty{padding:60px;text-align:center;color:var(--muted)}
</style>
</head>

<body>

<header>📺 Painel Streaming • ADMIN</header>

<!-- KPIs -->
<div class="kpis">
  <div class="kpi"><span>👤 Usuários</span><strong id="kpiUsers">0</strong></div>
  <div class="kpi"><span>✅ Ativos</span><strong id="kpiAtivos">0</strong></div>
  <div class="kpi"><span>💰 Receita</span><strong id="kpiReceita">R$ 0</strong></div>
  <div class="kpi"><span>🎬 Filmes</span><strong id="kpiFilmes">0</strong></div>
</div>

<!-- ASSISTINDO AGORA -->
<div class="section-title">🔴 Assistindo agora</div>
<div id="gridAgora" class="grid"></div>

<!-- FILMES -->
<div class="section-title">🎬 Filmes cadastrados</div>
<div id="gridFilmes" class="grid"></div>

<!-- USUÁRIOS -->
<div class="section-title">👤 Usuários cadastrados</div>
<div class="table-container">
<table>
<thead>
<tr>
<th>Usuário</th>
<th>Email</th>
<th>Status</th>
<th>Assinatura</th>
<th>Valor</th>
<th>Ações</th>
</tr>
</thead>
<tbody id="listaUsuarios"></tbody>
</table>
</div>

<!-- MODAL EDITAR -->
<div id="modalUser" class="modal">
  <div class="modal-content">
    <h3>Editar usuário</h3>
    <input id="editNome" placeholder="Nome">
    <input id="editWhatsapp" placeholder="WhatsApp">
    <input id="editValor" placeholder="Valor assinatura">
    <button onclick="salvarUsuario()">Salvar</button>
    <button class="modal-close" onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<script>
/* SUPABASE */
const sb = supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

const gridAgora = document.getElementById("gridAgora");
const gridFilmes = document.getElementById("gridFilmes");
const listaUsuarios = document.getElementById("listaUsuarios");

let usuarioEditando = null;

/* LOAD */
async function carregarADM(){

  /* ASSISTINDO AGORA */
  const {data:assistindo} = await sb
    .from("assistindo_agora")
    .select("item_id,titulo,tipo,usuario_email")
    .eq("status","assistindo");

  gridAgora.innerHTML = "";
  if(!assistindo?.length){
    gridAgora.innerHTML = `<div class="empty">Ninguém assistindo agora</div>`;
  }else{
    const ids = [...new Set(assistindo.map(a=>a.item_id))];
    const {data:filmesAgora} = await sb.from("filmes").select("id,capa_url").in("id",ids);
    const capas = {};
    filmesAgora?.forEach(f=>capas[f.id]=f.capa_url);

    const map = {};
    assistindo.forEach(a=>{
      if(!map[a.item_id]){
        map[a.item_id]={titulo:a.titulo,tipo:a.tipo,capa:capas[a.item_id],emails:new Set()};
      }
      map[a.item_id].emails.add(a.usuario_email);
    });

    Object.values(map).forEach(i=>{
      gridAgora.innerHTML += `
        <div class="card">
          <img src="${i.capa}">
          <div class="overlay"></div>
          <div class="info">
            <div class="title">${i.titulo}</div>
            <small>👀 ${i.emails.size}</small>
          </div>
        </div>`;
    });
  }

  /* FILMES */
  const {data:filmes} = await sb.from("filmes").select("*").order("created_at",{ascending:false});
  document.getElementById("kpiFilmes").textContent = filmes?.length || 0;
  gridFilmes.innerHTML = "";
  filmes?.forEach(f=>{
    gridFilmes.innerHTML += `
      <div class="card">
        <img src="${f.capa_url}">
        <div class="actions">
          <button onclick="excluirFilme('${f.id}')">🗑️</button>
        </div>
        <div class="overlay"></div>
        <div class="info">
          <div class="title">${f.titulo}</div>
        </div>
      </div>`;
  });

  /* USUÁRIOS */
  const {data:usuarios} = await sb.from("usuarios").select("*").order("created_at",{ascending:false});
  let ativos = 0;
  let receita = 0;

  listaUsuarios.innerHTML = "";
  usuarios?.forEach(u=>{
    if(u.status==="aprovado"){
      ativos++;
      receita += Number(u.valor_assinatura||0);
    }
    listaUsuarios.innerHTML += `
      <tr>
        <td>
          <div class="user-cell">
            <img src="${u.avatar_url || 'https://via.placeholder.com/40'}">
            <strong>${u.nome_usuario}</strong>
          </div>
        </td>
        <td>${u.email}</td>
        <td><span class="status ${u.status}">${u.status}</span></td>
        <td>${u.tipo_assinatura}</td>
        <td>R$ ${u.valor_assinatura || 0}</td>
        <td>
          <button onclick='editarUsuario(${JSON.stringify(u)})'>✏️</button>
          <button onclick="toggleStatus('${u.id}','${u.status}')">🚫</button>
        </td>
      </tr>`;
  });

  document.getElementById("kpiUsers").textContent = usuarios?.length || 0;
  document.getElementById("kpiAtivos").textContent = ativos;
  document.getElementById("kpiReceita").textContent = "R$ " + receita.toFixed(2);
}

/* AÇÕES */
function editarUsuario(u){
  usuarioEditando = u;
  editNome.value = u.nome_usuario;
  editWhatsapp.value = u.whatsapp;
  editValor.value = u.valor_assinatura;
  modalUser.style.display = "flex";
}
function fecharModal(){
  modalUser.style.display = "none";
}
async function salvarUsuario(){
  await sb.from("usuarios").update({
    nome_usuario: editNome.value,
    whatsapp: editWhatsapp.value,
    valor_assinatura: editValor.value
  }).eq("id", usuarioEditando.id);

  fecharModal();
  carregarADM();
}
async function toggleStatus(id,status){
  await sb.from("usuarios").update({
    status: status==="aprovado"?"bloqueado":"aprovado"
  }).eq("id",id);
  carregarADM();
}
async function excluirFilme(id){
  if(!confirm("Excluir filme?")) return;
  await sb.from("filmes").delete().eq("id",id);
  carregarADM();
}

/* INIT */
carregarADM();
</script>

</body>
</html>

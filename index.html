<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel • Streaming ADMIN</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#0f0f10;
  --card:#1c1c1e;
  --accent:#e50914;
  --green:#00c853;
  --yellow:#ff9800;
  --text:#fff;
  --muted:#aaa;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  touch-action:manipulation;
  overscroll-behavior:none;
}

/* HEADER */
header{
  padding:18px 22px;
  font-size:20px;
  font-weight:800;
}

/* TITLES */
.section-title{
  padding:18px 22px 6px;
  font-size:17px;
  font-weight:700;
}

/* SEARCH */
.search-box{
  padding:0 22px 12px;
}
.search-box input{
  width:100%;
  padding:14px;
  border-radius:12px;
  background:#111;
  border:1px solid #2a2a2a;
  color:#fff;
  font-size:16px;
}

/* KPIs */
.kpis{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
  padding:0 22px 18px;
}
.kpi{
  background:var(--card);
  border-radius:14px;
  padding:14px;
}
.kpi span{font-size:12px;color:var(--muted)}
.kpi strong{display:block;font-size:24px;margin-top:6px}

/* GRID */
.grid{
  padding:14px 22px 28px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:14px;
}
.card{
  position:relative;
  background:var(--card);
  border-radius:12px;
  overflow:hidden;
}
.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}
.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.15));
}
.info{
  position:absolute;
  bottom:0;
  padding:10px;
  width:100%;
}
.title{
  font-size:13px;
  font-weight:600;
}

/* ACTIONS */
.actions{
  position:absolute;
  top:8px;
  right:8px;
  z-index:2;
}
.actions button{
  background:#000;
  border:none;
  color:#fff;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}

/* TABLE USERS */
.table-container{
  padding:14px 22px 40px;
  overflow-x:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  background:var(--card);
  border-radius:14px;
  overflow:hidden;
}
th,td{
  padding:12px;
  border-bottom:1px solid #2a2a2a;
  font-size:13px;
  white-space:nowrap;
}
th{
  background:#161616;
  color:#ccc;
}
.user-cell{
  display:flex;
  align-items:center;
  gap:10px;
}
.user-cell img{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
}

/* STATUS */
.status{
  padding:4px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
}
.aprovado{background:var(--green)}
.bloqueado{background:var(--accent)}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
.modal-content{
  background:var(--card);
  padding:20px;
  border-radius:14px;
  width:420px;
  max-width:92%;
}
.modal-content h3{margin-bottom:10px}
.modal-content input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  background:#111;
  border:1px solid #2a2a2a;
  color:#fff;
  border-radius:8px;
}
.modal-content button{
  width:100%;
  padding:12px;
  background:var(--green);
  border:none;
  border-radius:8px;
  font-weight:700;
}
.modal-close{
  background:#333;
  margin-top:6px;
}

/* MOBILE */
@media(max-width:768px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
  .card img{
    height:160px;
  }
}
</style>
</head>

<body>

<header>📺 Painel Streaming • ADMIN</header>

<!-- KPIs -->
<div class="kpis">
  <div class="kpi"><span>👤 Usuários</span><strong id="kpiUsers">0</strong></div>
  <div class="kpi"><span>✅ Ativos</span><strong id="kpiAtivos">0</strong></div>
  <div class="kpi"><span>💰 Receita</span><strong id="kpiReceita">R$ 0</strong></div>
  <div class="kpi"><span>🎬 Filmes</span><strong id="kpiFilmes">0</strong></div>
</div>

<!-- BUSCA USUÁRIOS -->
<div class="search-box">
  <input id="buscaUsuario" placeholder="🔍 Buscar usuário por nome ou email">
</div>

<!-- USUÁRIOS -->
<div class="section-title">👤 Usuários cadastrados</div>
<div class="table-container">
<table>
<thead>
<tr>
<th>Usuário</th>
<th>Email</th>
<th>Status</th>
<th>Plano</th>
<th>Valor</th>
<th>Ações</th>
</tr>
</thead>
<tbody id="listaUsuarios"></tbody>
</table>
</div>

<!-- ASSISTINDO AGORA -->
<div class="section-title">🔴 Assistindo agora</div>
<div id="gridAgora" class="grid"></div>

<!-- FILMES -->
<div class="section-title">🎬 Filmes cadastrados</div>
<div id="gridFilmes" class="grid"></div>

<!-- MODAL -->
<div id="modalUser" class="modal">
  <div class="modal-content">
    <h3>Editar usuário</h3>
    <input id="editNome" placeholder="Nome">
    <input id="editWhatsapp" placeholder="WhatsApp">
    <input id="editValor" placeholder="Valor assinatura">
    <button onclick="salvarUsuario()">Salvar</button>
    <button class="modal-close" onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<script>
const sb = supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

const gridAgora = document.getElementById("gridAgora");
const gridFilmes = document.getElementById("gridFilmes");
const listaUsuarios = document.getElementById("listaUsuarios");
const buscaUsuario = document.getElementById("buscaUsuario");

let usuariosCache = [];
let usuarioEditando = null;

async function carregarADM(){
  /* USUÁRIOS */
  const {data:usuarios} = await sb.from("usuarios").select("*").order("created_at",{ascending:false});
  usuariosCache = usuarios || [];
  renderUsuarios(usuariosCache);

  let ativos = usuariosCache.filter(u=>u.status==="aprovado");
  document.getElementById("kpiUsers").textContent = usuariosCache.length;
  document.getElementById("kpiAtivos").textContent = ativos.length;
  document.getElementById("kpiReceita").textContent =
    "R$ " + ativos.reduce((s,u)=>s+Number(u.valor_assinatura||0),0).toFixed(2);

  /* FILMES */
  const {data:filmes} = await sb.from("filmes").select("*").order("created_at",{ascending:false});
  document.getElementById("kpiFilmes").textContent = filmes?.length || 0;
  gridFilmes.innerHTML="";
  filmes?.forEach(f=>{
    gridFilmes.innerHTML+=`
      <div class="card">
        <img src="${f.capa_url}">
        <div class="actions">
          <button onclick="excluirFilme('${f.id}')">🗑️</button>
        </div>
        <div class="overlay"></div>
        <div class="info"><div class="title">${f.titulo}</div></div>
      </div>`;
  });

  /* ASSISTINDO AGORA */
  const {data:assistindo} = await sb.from("assistindo_agora").select("*").eq("status","assistindo");
  gridAgora.innerHTML="";
  assistindo?.forEach(a=>{
    gridAgora.innerHTML+=`
      <div class="card">
        <div class="overlay"></div>
        <div class="info">
          <div class="title">${a.titulo}</div>
          <small>👀 ${a.usuario_email}</small>
        </div>
      </div>`;
  });
}

function renderUsuarios(lista){
  listaUsuarios.innerHTML="";
  lista.forEach(u=>{
    listaUsuarios.innerHTML+=`
      <tr>
        <td>
          <div class="user-cell">
            <img src="${u.avatar_url||'https://via.placeholder.com/40'}">
            <strong>${u.nome_usuario}</strong>
          </div>
        </td>
        <td>${u.email}</td>
        <td><span class="status ${u.status}">${u.status}</span></td>
        <td>${u.tipo_assinatura||"-"}</td>
        <td>R$ ${u.valor_assinatura||0}</td>
        <td>
          <button onclick='editarUsuario(${JSON.stringify(u)})'>✏️</button>
          <button onclick="toggleStatus('${u.id}','${u.status}')">🚫</button>
        </td>
      </tr>`;
  });
}

buscaUsuario.oninput = ()=>{
  const q = buscaUsuario.value.toLowerCase();
  renderUsuarios(
    usuariosCache.filter(u =>
      (u.nome_usuario||"").toLowerCase().includes(q) ||
      (u.email||"").toLowerCase().includes(q)
    )
  );
};

function editarUsuario(u){
  usuarioEditando=u;
  editNome.value=u.nome_usuario;
  editWhatsapp.value=u.whatsapp;
  editValor.value=u.valor_assinatura;
  modalUser.style.display="flex";
}
function fecharModal(){modalUser.style.display="none"}
async function salvarUsuario(){
  await sb.from("usuarios").update({
    nome_usuario:editNome.value,
    whatsapp:editWhatsapp.value,
    valor_assinatura:editValor.value
  }).eq("id",usuarioEditando.id);
  fecharModal();carregarADM();
}
async function toggleStatus(id,status){
  await sb.from("usuarios").update({
    status:status==="aprovado"?"bloqueado":"aprovado"
  }).eq("id",id);
  carregarADM();
}
async function excluirFilme(id){
  if(!confirm("Excluir filme?"))return;
  await sb.from("filmes").delete().eq("id",id);
  carregarADM();
}

carregarADM();
</script>

</body>
</html>

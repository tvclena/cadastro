<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CLENA TV • Painel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* ====================================================== */
/* RESET */
/* ====================================================== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,Arial,sans-serif;
}

:root{
  --bg:#0f0f10;
  --surface:#1b1b1e;
  --surface-soft:rgba(27,27,30,.85);
  --accent:#e50914;
  --border:#2b2b2b;
  --muted:#b5b5b5;
  --text:#ffffff;
}

body{
  height:100vh;
  display:flex;
  overflow:hidden;
  background:radial-gradient(70% 60% at 50% 25%, #1a1a1a 0%, #0f0f10 60%);
  color:var(--text);
}

/* ====================================================== */
/* SIDEBAR */
/* ====================================================== */
.sidebar{
  width:220px;
  background:var(--surface-soft);
  backdrop-filter:blur(16px);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding-top:18px;
  transition:width .25s;
  position:relative;
}
.sidebar.closed{ width:72px; }

.logo-area{
  text-align:center;
  padding-bottom:22px;
}
.logo-area img{
  width:120px;
  transition:.25s;
}
.sidebar.closed .logo-area img{ width:42px; }

#toggleMenu{
  position:absolute;
  left:210px;
  top:14px;
  width:32px;
  height:32px;
  border-radius:50%;
  background:var(--accent);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.6);
}
.sidebar.closed #toggleMenu{ left:56px; }

/* ====================================================== */
/* MENU */
/* ====================================================== */
.menu{ margin-top:6px; }

.menu-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 18px;
  margin:4px 10px;
  font-size:14px;
  color:#e5e5e5;
  border-radius:10px;
  cursor:pointer;
  transition:.2s;
}
.menu-item img{ width:20px; filter:invert(1); opacity:.9; }

.menu-item:hover{
  background:rgba(229,9,20,.15);
}

.menu-item.active{
  background:rgba(229,9,20,.22);
  font-weight:700;
  border-left:4px solid var(--accent);
}

.sidebar.closed .label{ display:none; }

/* SUBMENU */
.submenu{
  display:none;
  margin-left:44px;
}
.submenu a{
  display:flex;
  padding:8px 12px;
  font-size:13px;
  border-radius:8px;
  color:var(--muted);
  cursor:pointer;
}
.submenu a:hover{
  background:rgba(229,9,20,.18);
}
.submenu a.active-sub{
  background:rgba(229,9,20,.28);
  font-weight:600;
  color:#fff;
}
.sidebar.closed .submenu{ margin-left:18px; }
.sidebar.closed .submenu .label{ display:none; }

/* ====================================================== */
/* MAIN */
/* ====================================================== */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  height:100vh;
}

/* HEADER */
.header{
  height:52px;
  background:var(--surface-soft);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
}

.logo-title{
  font-size:20px;
  font-weight:900;
  letter-spacing:3px;
}
.logo-title span{ color:var(--accent); }

.user-area{
  display:flex;
  align-items:center;
  gap:18px;
  font-size:14px;
}
.logout{
  cursor:pointer;
  font-weight:700;
  color:#ffb4b4;
}
.logout:hover{ color:#fff; }

iframe{
  border:none;
  width:100%;
  height:calc(100vh - 52px);
  background:transparent;
  position:relative;
  z-index:1;
}
body.search-open iframe{
  pointer-events:none;
}
.search-results,
.autocomplete-list{
  position:absolute;
  z-index:9999;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

  <div id="toggleMenu" onclick="toggleMenu()">❮</div>

  <div class="logo-area">
    <!-- SUA LOGO -->
    <img src="logo.png">
  </div>

  <div class="menu">

    <div class="menu-item active" onclick="openPage('home.html')" data-page="home.html">
      <img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png">
      <span class="label">Home</span>
    </div>

    <div class="menu-item" onclick="toggleSub('sub_conteudo')">
      <img src="https://cdn-icons-png.flaticon.com/512/149/149852.png">
      <span class="label">Conteúdo</span>
    </div>

    <div class="submenu" id="sub_conteudo">
      <a onclick="openPage('cadastro/index.html')" data-page="cadastro/index.html">
        <span class="label">Registar</span>
      </a>
      <a onclick="openPage('qrcode.html')" data-page="qrcode.html">
        <span class="label">QR-Code</span>
      </a>
      <a onclick="openPage('categorias.html')" data-page="categorias.html">
        <span class="label">Categorias</span>
      </a>
    </div>

    <div class="menu-item" onclick="openPage('dashboard.html')" data-page="dashboard.html">
      <img src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png">
      <span class="label">Dashboard</span>
    </div>

    <div class="menu-item" onclick="openPage('configuracoes.html')" data-page="configuracoes.html">
      <img src="https://cdn-icons-png.flaticon.com/512/3524/3524659.png">
      <span class="label">Configurações</span>
    </div>

  </div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="header">
    <div class="logo-title">CLENA <span>TV</span></div>
    <div class="user-area">
      <span id="userMail">Admin</span>
      <span class="logout" onclick="logout()">Sair</span>
    </div>
  </div>

  <iframe id="frame" src="home.html"></iframe>

</div>

<script>
function openPage(page){
  document.getElementById("frame").src = page;
  highlightMenu(page);
}

function highlightMenu(page){
  document.querySelectorAll(".menu-item").forEach(i=>i.classList.remove("active"));
  document.querySelectorAll(".submenu a").forEach(i=>i.classList.remove("active-sub"));

  const sub = document.querySelector(`a[data-page="${page}"]`);
  if(sub){
    sub.classList.add("active-sub");
    sub.closest(".submenu").previousElementSibling.classList.add("active");
  }else{
    const main = document.querySelector(`.menu-item[data-page="${page}"]`);
    if(main) main.classList.add("active");
  }
}

function toggleSub(id){
  const el=document.getElementById(id);
  el.style.display = el.style.display==="block" ? "none" : "block";
}

function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("closed");
}

function logout(){
  // depois conecta com Supabase Auth
  alert("Logout");
}
</script>
<script>
const input = document.querySelector('input');

input.addEventListener('focus', () => {
  window.parent.document.body.classList.add('search-open');
});

input.addEventListener('blur', () => {
  setTimeout(() => {
    window.parent.document.body.classList.remove('search-open');
  }, 200);
});
</script>

  
</body>
</html>

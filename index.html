<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel • Streaming</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#0f0f10;
  --card:#1c1c1e;
  --accent:#e50914;
  --green:#00c853;
  --text:#fff;
  --muted:#aaa;
}

*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}

/* HEADER */
header{
  padding:22px 32px;
  font-size:22px;
  font-weight:800;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* KPIS */
.kpis{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  padding:0 32px 20px;
}

.kpi{
  background:var(--card);
  border-radius:14px;
  padding:16px;
}

.kpi span{
  font-size:12px;
  color:var(--muted);
}

.kpi strong{
  display:block;
  font-size:26px;
  margin-top:6px;
}

/* GRID */
.grid{
  padding:20px 32px 40px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:20px;
}

.card{
  position:relative;
  background:var(--card);
  border-radius:14px;
  overflow:hidden;
  transition:.25s;
}

.card:hover{
  transform:scale(1.04);
  box-shadow:0 20px 40px rgba(0,0,0,.6);
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
}

.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(0,0,0,.9),
    rgba(0,0,0,.35),
    rgba(0,0,0,0)
  );
}

.info{
  position:absolute;
  bottom:0;
  width:100%;
  padding:14px;
}

.title{
  font-size:14px;
  font-weight:600;
  margin-bottom:6px;
}

.badges{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.badge{
  padding:4px 8px;
  font-size:11px;
  border-radius:999px;
  background:#222;
}

.badge.red{background:var(--accent)}
.badge.green{background:var(--green)}

.section-title{
  padding:10px 32px 0;
  font-size:18px;
  font-weight:700;
}

.empty{
  padding:60px;
  text-align:center;
  color:var(--muted);
}
</style>
</head>

<body>

<header>
  📺 Painel Streaming
</header>

<!-- KPIs -->
<div class="kpis">
  <div class="kpi"><span>👀 Assistindo agora</span><strong id="kpiAgora">0</strong></div>
  <div class="kpi"><span>👤 Usuários únicos</span><strong id="kpiUsuarios">0</strong></div>
  <div class="kpi"><span>🎬 Total de plays</span><strong id="kpiPlays">0</strong></div>
  <div class="kpi"><span>📺 Títulos assistidos</span><strong id="kpiTitulos">0</strong></div>
</div>

<div class="section-title">🔴 Assistindo agora</div>
<div id="grid" class="grid"></div>

<script>
/* ================= SUPABASE ================= */
const sb = supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

const grid = document.getElementById("grid");

/* ================= KPIs ================= */
const kpiAgora = document.getElementById("kpiAgora");
const kpiUsuarios = document.getElementById("kpiUsuarios");
const kpiPlays = document.getElementById("kpiPlays");
const kpiTitulos = document.getElementById("kpiTitulos");

/* ================= LOAD ================= */
async function carregarPainel() {

  /* 🔴 ASSISTINDO AGORA */
  const { data: assistindo } = await sb
    .from("assistindo_agora")
    .select("item_id, titulo, tipo, usuario_email")
    .eq("status", "assistindo");

  if (!assistindo || !assistindo.length) {
    grid.innerHTML = `<div class="empty">Ninguém assistindo agora</div>`;
    kpiAgora.textContent = 0;
  } else {

    const itemIds = [...new Set(assistindo.map(a => a.item_id))];

    const { data: filmes } = await sb
      .from("filmes")
      .select("id, capa_url")
      .in("id", itemIds);

    const capas = {};
    (filmes || []).forEach(f => capas[f.id] = f.capa_url);

    const map = {};

    assistindo.forEach(r => {
      if (!map[r.item_id]) {
        map[r.item_id] = {
          titulo: r.titulo,
          tipo: r.tipo,
          capa: capas[r.item_id] || "",
          emails: new Set()
        };
      }
      map[r.item_id].emails.add(r.usuario_email);
    });

    kpiAgora.textContent = assistindo
      .map(a => a.usuario_email)
      .filter((v,i,a)=>a.indexOf(v)===i).length;

    grid.innerHTML = "";

    Object.values(map).forEach(i => {
      grid.innerHTML += `
        <div class="card">
          <img src="${i.capa}">
          <div class="overlay"></div>
          <div class="info">
            <div class="title">${i.titulo}</div>
            <div class="badges">
              <span class="badge red">${i.tipo}</span>
              <span class="badge green">👀 ${i.emails.size}</span>
            </div>
          </div>
        </div>
      `;
    });
  }

  /* 📊 HISTÓRICO */
  const { data: historico } = await sb
    .from("historico_assistidos")
    .select("usuario_email, item_id");

  if (historico && historico.length) {
    kpiPlays.textContent = historico.length;

    kpiUsuarios.textContent = [
      ...new Set(historico.map(h => h.usuario_email))
    ].length;

    kpiTitulos.textContent = [
      ...new Set(historico.map(h => h.item_id))
    ].length;
  }
}

/* ================= REALTIME ================= */
sb.channel("assistindo-agora")
  .on(
    "postgres_changes",
    { event: "*", schema: "public", table: "assistindo_agora" },
    carregarPainel
  )
  .subscribe();

/* INIT */
carregarPainel();
</script>

</body>
</html>

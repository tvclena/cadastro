<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Admin | CLENA TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;font-family:Inter,Arial}
body{margin:0;background:#0f0f10;color:#fff}

/* HEADER */
header{
  height:64px;padding:0 32px;
  display:flex;align-items:center;
  background:#1b1b1e;border-bottom:1px solid #2b2b2b
}
header h1 span{color:#22c55e}

/* CONTAINER */
.container{padding:32px}

/* TOOLBAR */
.toolbar{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.search{
  flex:1;min-width:240px;
  padding:12px 16px;border-radius:10px;
  border:1px solid #333;background:#111;color:#fff
}
.btn{
  padding:10px 14px;border:none;border-radius:10px;
  cursor:pointer;font-weight:700;font-size:13px
}
.btn.green{background:#22c55e;color:#000}
.btn.red{background:#e50914;color:#fff}
.btn.gray{background:#333;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* TABLE */
table{width:100%;border-collapse:collapse;background:#1b1b1e;border-radius:14px}
th,td{padding:14px;border-bottom:1px solid #2b2b2b;font-size:14px}
th{color:#aaa;background:#161618}

/* SWITCH */
.switch{position:relative;width:44px;height:22px}
.switch input{display:none}
.slider{
  position:absolute;inset:0;background:#444;
  border-radius:999px;cursor:pointer
}
.slider:before{
  content:"";position:absolute;
  width:16px;height:16px;
  top:3px;left:3px;background:#fff;
  border-radius:50%;transition:.2s
}
input:checked + .slider{background:#22c55e}
input:checked + .slider:before{transform:translateX(22px)}
input:disabled + .slider{opacity:.5;cursor:not-allowed}

/* LOGS */
.logs{margin-top:42px}
small{color:#aaa}

/* LOADING OVERLAY */
#loading{
  position:fixed;inset:0;
  background:rgba(0,0,0,.65);
  display:none;align-items:center;
  justify-content:center;z-index:9999
}
.spinner{
  width:42px;height:42px;
  border:4px solid #333;
  border-top:4px solid #22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>

<div id="loading"><div class="spinner"></div></div>

<header>
  <h1>CLENA <span>TV</span> · Admin</h1>
</header>

<div class="container">

<div class="toolbar">
  <input id="busca" class="search" placeholder="Buscar por email, nome ou @username">
  <button class="btn green" onclick="ativarSessaoMassa()">Ativar sessão única</button>
  <button class="btn gray" onclick="desativarSessaoMassa()">Desativar sessão única</button>
  <button class="btn red" onclick="derrubarSessaoMassa()">Derrubar sessões</button>
</div>

<table id="tabelaUsuarios">
<thead>
<tr>
<th><input type="checkbox" id="checkAll"></th>
<th>Email</th><th>Nome</th><th>Usuário</th><th>Sessão única</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div class="logs">
<h2>Histórico de logins</h2>
<table id="tabelaLogs">
<thead>
<tr><th>Email</th><th>IP</th><th>Navegador</th><th>Data</th></tr>
</thead>
<tbody></tbody>
</table>
</div>

</div>

<script>
const sb = supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

let usuarios=[];

function setLoading(v){
  document.getElementById("loading").style.display = v ? "flex" : "none";
}

/* LOAD USERS */
async function carregarUsuarios(){
  setLoading(true);
  const { data } = await sb.from("usuarios")
    .select("id,email,nome_usuario,username,controle_sessao");
  usuarios=data||[];
  renderUsuarios(usuarios);
  setLoading(false);
}

/* RENDER */
function renderUsuarios(lista){
  const tbody=document.querySelector("#tabelaUsuarios tbody");
  tbody.innerHTML="";
  lista.forEach(u=>{
    tbody.innerHTML+=`
    <tr>
      <td><input type="checkbox" class="ck" value="${u.id}"></td>
      <td>${u.email}</td>
      <td>${u.nome_usuario||"-"}</td>
      <td>@${u.username||"-"}</td>
      <td>
        <label class="switch">
          <input type="checkbox"
            ${u.controle_sessao?"checked":""}
            onchange="toggleSessao(this,'${u.id}')">
          <span class="slider"></span>
        </label>
      </td>
    </tr>`;
  });
}

/* SWITCH REAL */
async function toggleSessao(el,id){
  el.disabled=true;
  setLoading(true);

  const novo = !el.checked;

  await sb.from("usuarios")
    .update({ controle_sessao: novo })
    .eq("id",id);

  await carregarUsuarios();
  setLoading(false);
}

/* MASS */
function selecionados(){
  return [...document.querySelectorAll(".ck:checked")].map(c=>c.value);
}

async function ativarSessaoMassa(){
  const ids=selecionados(); if(!ids.length)return alert("Selecione usuários");
  setLoading(true);
  await sb.from("usuarios").update({controle_sessao:true}).in("id",ids);
  await carregarUsuarios();
}

async function desativarSessaoMassa(){
  const ids=selecionados(); if(!ids.length)return alert("Selecione usuários");
  setLoading(true);
  await sb.from("usuarios").update({controle_sessao:false}).in("id",ids);
  await carregarUsuarios();
}

async function derrubarSessaoMassa(){
  const ids=selecionados();
  if(!ids.length||!confirm("Derrubar sessões?"))return;
  setLoading(true);
  for(const id of ids){
    await sb.from("usuarios")
      .update({session_token:crypto.randomUUID()})
      .eq("id",id);
  }
  setLoading(false);
  alert("Sessões derrubadas");
}

/* LOGS */
async function carregarLogs(){
  const { data } = await sb.from("login_logs")
    .select("*").order("created_at",{ascending:false}).limit(50);
  const tbody=document.querySelector("#tabelaLogs tbody");
  tbody.innerHTML="";
  data.forEach(l=>{
    tbody.innerHTML+=`
    <tr>
      <td>${l.email}</td>
      <td>${l.ip||"-"}</td>
      <td><small>${l.user_agent||"-"}</small></td>
      <td>${new Date(l.created_at).toLocaleString("pt-BR")}</td>
    </tr>`;
  });
}

carregarUsuarios();
carregarLogs();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Admin | CLENA TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;font-family:Inter,Arial}
body{
  margin:0;
  background:#0f0f10;
  color:#fff;
}

/* HEADER */
header{
  height:64px;
  padding:0 32px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#1b1b1e;
  border-bottom:1px solid #2b2b2b;
}
header h1 span{color:#22c55e}

/* CONTAINER */
.container{padding:32px}

/* TOOLBAR */
.toolbar{
  display:flex;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.search{
  flex:1;
  min-width:240px;
  padding:12px 16px;
  border-radius:10px;
  border:1px solid #333;
  background:#111;
  color:#fff;
}
.btn{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
  font-size:13px;
}
.btn.green{background:#22c55e;color:#000}
.btn.red{background:#e50914;color:#fff}
.btn.gray{background:#333;color:#fff}
.btn:hover{filter:brightness(1.1)}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  background:#1b1b1e;
  border-radius:14px;
  overflow:hidden;
}
th,td{
  padding:14px;
  border-bottom:1px solid #2b2b2b;
  font-size:14px;
}
th{color:#aaa;background:#161618}
tr:hover{background:#232326}

/* SWITCH */
.switch{
  position:relative;
  width:44px;
  height:22px;
}
.switch input{display:none}
.slider{
  position:absolute;inset:0;
  background:#444;
  border-radius:999px;
  cursor:pointer;
}
.slider:before{
  content:"";
  position:absolute;
  width:16px;height:16px;
  top:3px;left:3px;
  background:#fff;
  border-radius:50%;
  transition:.2s;
}
input:checked + .slider{
  background:#22c55e;
}
input:checked + .slider:before{
  transform:translateX(22px);
}

/* LOGS */
.logs{margin-top:42px}
small{color:#aaa}
</style>
</head>

<body>

<header>
  <h1>CLENA <span>TV</span> · Admin</h1>
  <button class="btn gray" onclick="logout()">Sair</button>
</header>

<div class="container">

  <!-- TOOLBAR -->
  <div class="toolbar">
    <input id="busca" class="search" placeholder="Buscar por email, nome ou @username">
    <button class="btn green" onclick="ativarSessaoMassa()">Ativar sessão única</button>
    <button class="btn gray" onclick="desativarSessaoMassa()">Desativar sessão única</button>
    <button class="btn red" onclick="derrubarSessaoMassa()">Derrubar sessões</button>
  </div>

  <!-- USUÁRIOS -->
  <table id="tabelaUsuarios">
    <thead>
      <tr>
        <th><input type="checkbox" id="checkAll"></th>
        <th>Email</th>
        <th>Nome</th>
        <th>Usuário</th>
        <th>Sessão única</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- LOGS -->
  <div class="logs">
    <h2>Histórico de logins</h2>
    <table id="tabelaLogs">
      <thead>
        <tr>
          <th>Email</th>
          <th>IP</th>
          <th>Navegador</th>
          <th>Data</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<script>
const sb = supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

let usuarios = [];

/* AUTH ADMIN */
(async()=>{
  const email = localStorage.getItem("usuario_email");
  if(!email){
    localStorage.setItem("redirect_after_login","adm.html");
    location.replace("login.html");
    return;
  }

  const { data } = await sb
    .from("usuarios")
    .select("is_admin")
    .eq("email",email)
    .single();

  if(!data || data.is_admin!==true){
    alert("Acesso negado");
    location.replace("index.html");
    return;
  }

  carregarUsuarios();
  carregarLogs();
})();

/* LOAD USERS */
async function carregarUsuarios(){
  const { data } = await sb
    .from("usuarios")
    .select("id,email,nome_usuario,username,controle_sessao");

  usuarios = data || [];
  renderUsuarios(usuarios);
}

/* RENDER USERS */
function renderUsuarios(lista){
  const tbody = document.querySelector("#tabelaUsuarios tbody");
  tbody.innerHTML = "";

  lista.forEach(u=>{
    tbody.innerHTML += `
      <tr>
        <td><input type="checkbox" class="ck" value="${u.id}"></td>
        <td>${u.email}</td>
        <td>${u.nome_usuario || "-"}</td>
        <td>@${u.username || "-"}</td>
        <td>
          <label class="switch">
            <input type="checkbox"
              ${u.controle_sessao ? "checked":""}
              onchange="toggleSessao('${u.id}',this.checked)">
            <span class="slider"></span>
          </label>
        </td>
      </tr>
    `;
  });
}

/* SEARCH */
busca.oninput = ()=>{
  const q = busca.value.toLowerCase();
  renderUsuarios(
    usuarios.filter(u =>
      (u.email||"").toLowerCase().includes(q) ||
      (u.nome_usuario||"").toLowerCase().includes(q) ||
      (u.username||"").toLowerCase().includes(q)
    )
  );
};

/* CHECK ALL */
checkAll.onchange = ()=>{
  document.querySelectorAll(".ck").forEach(c=>c.checked=checkAll.checked);
};

/* HELPERS */
function selecionados(){
  return [...document.querySelectorAll(".ck:checked")].map(c=>c.value);
}

/* MASS ACTIONS */
async function ativarSessaoMassa(){
  const ids = selecionados();
  if(!ids.length) return alert("Selecione usuários");

  await sb.from("usuarios")
    .update({ controle_sessao:true })
    .in("id",ids);

  carregarUsuarios();
}

async function desativarSessaoMassa(){
  const ids = selecionados();
  if(!ids.length) return alert("Selecione usuários");

  await sb.from("usuarios")
    .update({ controle_sessao:false })
    .in("id",ids);

  carregarUsuarios();
}

async function derrubarSessaoMassa(){
  const ids = selecionados();
  if(!ids.length) return alert("Selecione usuários");
  if(!confirm("Derrubar sessões dos selecionados?")) return;

  for(const id of ids){
    await sb.from("usuarios")
      .update({ session_token:crypto.randomUUID() })
      .eq("id",id);
  }

  alert("Sessões derrubadas");
}

/* INDIVIDUAL */
async function toggleSessao(id,val){
  await sb.from("usuarios")
    .update({ controle_sessao:val })
    .eq("id",id);
}

/* LOGS */
async function carregarLogs(){
  const { data } = await sb
    .from("login_logs")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(50);

  const tbody = document.querySelector("#tabelaLogs tbody");
  tbody.innerHTML="";

  data.forEach(l=>{
    tbody.innerHTML+=`
      <tr>
        <td>${l.email}</td>
        <td>${l.ip||"-"}</td>
        <td><small>${l.user_agent||"-"}</small></td>
        <td>${new Date(l.created_at).toLocaleString("pt-BR")}</td>
      </tr>
    `;
  });
}

function logout(){
  localStorage.clear();
  location.replace("login.html");
}
</script>

</body>
</html>
